<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mebelix Admin Panel</title>
    <style>
        body { font-family: sans-serif; padding: 15px; background: #f4f4f9; max-width: 600px; margin: auto; }
        .card { background: white; padding: 15px; margin-bottom: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        label { font-size: 13px; font-weight: bold; color: #333; margin-top: 8px; display: block; }
        input, textarea, select, button { width: 100%; padding: 10px; margin: 4px 0 10px 0; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #007bff; color: white; font-weight: bold; cursor: pointer; border: none; }
        button:hover { opacity: 0.9; }
        
        /* Kategoriyalar ustma-ust tushmasligi uchun to'g'rilangan dizayn */
        .checkbox-group { display: flex; flex-direction: column; gap: 8px; margin: 8px 0; max-height: 180px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; border-radius: 6px; background: #fafafa; }
        .checkbox-label { font-size: 14px; display: flex; align-items: center; gap: 10px; cursor: pointer; color: #222; }
        .checkbox-label input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
        
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>

    <h2>🛠 Mebelix Admin Panel</h2>

    <!-- 1. Yangi Mahsulot Qo'shish -->
    <div class="card">
        <h3>➕ Yangi Mahsulot Qo'shish</h3>
        <form id="product-form" onsubmit="addProduct(event)">
            <label>Mahsulot nomi (O'zbekcha):</label>
            <input type="text" id="name_uz" placeholder="Mahsulot nomi (O'zbekcha)" required>
            
            <label>Mahsulot nomi (Русский):</label>
            <input type="text" id="name_ru" placeholder="Mahsulot nomi (Русский)" required>
            
            <label>Kategoriyalar (bir nechta tanlash mumkin):</label>
            <div class="checkbox-group" id="categories-checkboxes"></div>

            <label>Narxi (so'mda):</label>
            <input type="number" id="price" placeholder="Narxi (so'mda)" required>
            
            <label>O'lchamlari:</label>
            <input type="text" id="dimensions" placeholder="O'lchamlari (masalan: 200x150x60 sm)">
            
            <label>Yetkazib berish muddati (kun):</label>
            <input type="number" id="delivery_days" placeholder="Yetkazib berish muddati (kun)" value="3" required>
            
            <label>Batafsil tavsif (O'zbekcha):</label>
            <textarea id="desc_uz" placeholder="Batafsil tavsif (O'zbekcha)"></textarea>
            
            <label>Batafsil tavsif (Русский):</label>
            <textarea id="desc_ru" placeholder="Batafsil tavsif (Русский)"></textarea>

            <label>Rasmlar (10 tagacha):</label>
            <input type="file" id="images" accept="image/*" multiple max="10">

            <button type="submit" style="background: #28a745;">Mahsulotni qo'shish</button>
        </form>
    </div>

    <!-- 2. Mijozlar Ro'yxati -->
    <div class="card">
        <h3>👥 Botga kirgan mijozlar</h3>
        <table id="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Ism / Username</th>
                    <th>Til</th>
                </tr>
            </thead>
            <tbody id="users-list"></tbody>
        </table>
    </div>

    <!-- 3. Mahsulotlarni O'chirish -->
    <div class="card">
        <h3>🗑 Mavjud mahsulotlar (O'chirish)</h3>
        <div id="products-list"></div>
    </div>

<script>
    const categoriesList = [
        "shkaflar", "krovatlar", "tumbalar", "oshxona mebellari", "ofis mebellari",
        "bolalar mebellari", "yotoqxona mebellari", "LDSP va LMDF", "oyoq kiyim javoni",
        "televizor podstavkalari", "devor uchun LMDF panellar", "matraslar", "stol va stullar"
    ];

    function renderCheckboxes() {
        const container = document.getElementById('categories-checkboxes');
        container.innerHTML = categoriesList.map(cat => `
            <label class="checkbox-label">
                <input type="checkbox" name="category" value="${cat}"> <span>${cat}</span>
            </label>
        `).join('');
    }

    async function loadData() {
        const usersRes = await fetch('/api/users');
        const users = await usersRes.json();
        document.getElementById('users-list').innerHTML = users.map(u => `
            <tr>
                <td>${u.telegram_id}</td>
                <td>${u.first_name || ''} (@${u.username || 'yoq'})</td>
                <td>${u.language}</td>
            </tr>
        `).join('');

        const prodRes = await fetch('/api/products');
        const products = await prodRes.json();
        document.getElementById('products-list').innerHTML = products.map(p => `
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 8px 0;">
                <span><b>${p.name_uz}</b> — ${Number(p.price).toLocaleString()} so'm</span>
                <button onclick="deleteProduct(${p.id})" style="background: #dc3545; width: auto; padding: 5px 10px; font-size: 12px; margin: 0;">O'chirish</button>
            </div>
        `).join('');
    }

    async function addProduct(e) {
        e.preventDefault();
        const checkboxes = document.querySelectorAll('input[name="category"]:checked');
        const selectedCategories = Array.from(checkboxes).map(cb => cb.value);

        if (selectedCategories.length === 0) {
            alert("Kamida bitta kategoriyani tanlang!");
            return;
        }

        const filesInput = document.getElementById('images');
        let imageUrls = [];

        for (let i = 0; i < Math.min(filesInput.files.length, 10); i++) {
            const base64 = await toBase64(filesInput.files[i]);
            imageUrls.push(base64);
        }

        const productData = {
            name_uz: document.getElementById('name_uz').value,
            name_ru: document.getElementById('name_ru').value,
            categories: selectedCategories,
            price: Number(document.getElementById('price').value),
            dimensions: document.getElementById('dimensions').value,
            delivery_days: Number(document.getElementById('delivery_days').value),
            description_uz: document.getElementById('desc_uz').value,
            description_ru: document.getElementById('desc_ru').value,
            images: imageUrls
        };

        const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(productData)
        });

        const data = await res.json();
        if (data.success) {
            alert("Mahsulot muvaffaqiyatli qo'shildi!");
            document.getElementById('product-form').reset();
            loadData();
        } else {
            alert("Xatolik yuz berdi: " + data.error);
        }
    }

    function toBase64(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve(reader.result);
            reader.onerror = error => reject(error);
        });
    }

    async function deleteProduct(id) {
        if (!confirm("Haqiqatan ham bu mahsulotni o'chirmoqchimisiz?")) return;
        const res = await fetch(`/api/products/${id}`, { method: 'DELETE' });
        const data = await res.json();
        if (data.success) {
            loadData();
        }
    }

    renderCheckboxes();
    loadData();
</script>
</body>
</html>
