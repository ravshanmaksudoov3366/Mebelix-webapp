<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mebelix - Mebellar Do'koni</title>
  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 15px;
      background-color: #f4f4f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
      font-size: 22px;
    }
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }
    .product-card {
      background: #fff;
      border-radius: 10px;
      padding: 15px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .product-info h3 {
      margin: 0 0 5px 0;
      font-size: 16px;
    }
    .product-info p {
      margin: 0;
      color: #27ae60;
      font-weight: bold;
    }
    .btn-add {
      background: #3498db;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 5px;
      cursor: pointer;
    }
    .cart-summary {
      background: #fff;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .btn-submit {
      width: 100%;
      background: #27ae60;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>Mebelix Katalogi</h1>

  <div id="products" class="product-list"></div>

  <div class="cart-summary">
    <h3>Savat</h3>
    <div id="cart-items">Savat bo'sh</div>
    <p><strong>Jami: </strong><span id="total-price">0 $</span></p>
    <button class="btn-submit" onclick="submitOrder()">Rasmiylashtirish</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Oynani to'liq ekranga yozish

    let cart = [];

    // JSON ma'lumotlarini yuklash
    fetch('products.json')
      .then(res => res.json())
      .then(data => {
        const container = document.getElementById('products');
        container.innerHTML = '';
        data.forEach(p => {
          container.innerHTML += `
            <div class="product-card">
              <div class="product-info">
                <h3>${p.name}</h3>
                <p>${p.price} $</p>
              </div>
              <button class="btn-add" onclick="addToCart('${p.name}', ${p.price})">Qo'shish</button>
            </div>
          `;
        });
      })
      .catch(err => console.error("Xatolik:", err));

    function addToCart(name, price) {
      cart.push({ name, price, quantity: 1 });
      renderCart();
    }

    function renderCart() {
      const cartDiv = document.getElementById('cart-items');
      const totalSpan = document.getElementById('total-price');
      if (cart.length === 0) {
        cartDiv.innerHTML = "Savat bo'sh";
        totalSpan.innerText = "0 $";
        return;
      }
      cartDiv.innerHTML = cart.map(i => `• ${i.name} (${i.price} $)`).join('<br>');
      const total = cart.reduce((sum, item) => sum + item.price, 0);
      totalSpan.innerText = total + " $";
    }

    function submitOrder() {
      if (cart.length === 0) {
        alert("Iltimos, avval mahsulot tanlang!");
        return;
      }
      
      const totalPrice = cart.reduce((sum, item) => sum + item.price, 0) + " $";
      const orderData = {
        items: cart,
        totalPrice: totalPrice
      };

      // Telegram Bot'ga ma'lumotni yuborish
      if (tg && tg.sendData) {
        tg.sendData(JSON.stringify(orderData));
      } else {
        alert("Telegram WebApp topilmadi. Botingiz orqali kiring.");
      }
    }
  </script>
</body>
</html>
