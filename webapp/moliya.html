<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Moliya — iSofa</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg2:#f6f2ea;--text:#1f1e1f;--hint:#6f695f;--line:#e6dfd2;--soft:#f3e8cd;--gold:#e9cc85;--gold2:#c9a24a;--char:#363435;--char2:#2a292a;--green:#3d7a4a;--red:#b0432c;--serif:"Cormorant Garamond",Georgia,serif;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14.5px}
button,input,select{font-family:inherit;color:var(--text)}
header{background:var(--char);padding:12px 16px;display:flex;align-items:center;gap:12px}
.back{border:1px solid #5a5758;color:var(--gold);border-radius:12px;padding:8px 11px;font-size:13px;font-weight:600;text-decoration:none;white-space:nowrap}
.brand{display:flex;flex-direction:column;color:var(--gold);font-size:22px;font-weight:600;line-height:1}
.brand small{font-size:8px;letter-spacing:1.6px;color:#cdb57a;margin-top:3px;font-weight:500}
header h1{margin:0 0 0 auto;font-family:var(--serif);font-size:24px;color:#f6f2ea;font-weight:600}
main{max-width:1280px;margin:0 auto;padding:14px;display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:var(--r);padding:16px}
.card h2{margin:0 0 12px;font-family:var(--serif);font-size:22px;font-weight:600;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:Montserrat,sans-serif;font-size:12.5px;color:var(--hint);font-weight:500}
.period{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.period>button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 13px;font-weight:600;font-size:13px;cursor:pointer}
.period>button.on{background:var(--char);color:var(--gold);border-color:var(--char)}
.period input{border:1.5px solid var(--line);border-radius:10px;padding:7px 8px;font-size:13px;background:#fff}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
.btn{border:0;border-radius:12px;padding:10px 14px;font-weight:600;font-size:13.5px;cursor:pointer;background:var(--char);color:var(--gold);text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn.l{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn:disabled{opacity:.6}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}}
@media(max-width:560px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:#fff;border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:12px;color:var(--hint);font-weight:600}
.kpi b{font-size:21px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:11.5px;color:var(--hint)}
.kpi.main{background:var(--char);color:#f6f2ea}.kpi.main span,.kpi.main small{color:#cdb57a}.kpi.main b{color:var(--gold)}
.neg{color:var(--red)!important}
.grid2{display:grid;grid-template-columns:1.6fr 1fr;gap:14px}
@media(max-width:980px){.grid2{grid-template-columns:1fr}}
.chart svg{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.cats{display:flex;flex-direction:column;gap:9px}
.catrow{display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center;font-size:13px}
.bar{height:10px;border-radius:6px;background:var(--bg2);overflow:hidden}.bar i{display:block;height:100%;background:var(--gold2);border-radius:6px}
.pipe{background:var(--soft);border-radius:12px;padding:12px;font-size:13px;line-height:1.5;margin-top:12px}
.form{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end}
@media(max-width:900px){.form{grid-template-columns:1fr 1fr}}
.f{display:flex;flex-direction:column;gap:5px}
.f label{font-size:12px;color:var(--hint);font-weight:600}
.inp{border:1.5px solid var(--line);border-radius:11px;padding:11px;font-size:15px;background:#fff;width:100%}
.f.wide{grid-column:span 2}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:7px 11px;font-weight:600;font-size:12.5px;cursor:pointer}
.chips button.on{background:var(--char);color:var(--gold);border-color:var(--char)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.tabs button{border:0;background:var(--bg2);border-radius:11px;padding:9px 14px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--hint)}
.tabs button.on{background:var(--char);color:var(--gold)}
.tabs input{margin-left:auto;max-width:260px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:11.5px;color:var(--hint);font-weight:600;padding:8px;border-bottom:1.5px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid #f0ebe1;vertical-align:top}
td.n,th.n{text-align:right;white-space:nowrap}
tr:hover td{background:#fbf8f2}
.tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:7px;background:var(--bg2);white-space:nowrap}
.tag.c{background:#e8efe3}
.warn{color:#9a6a12;font-size:11.5px}
.link{border:0;background:none;color:#8a6a24;font-weight:600;cursor:pointer;padding:0;font-size:12.5px}
.del{border:0;background:none;color:var(--red);cursor:pointer;font-size:12.5px;font-weight:600}
@media(max-width:700px){
  table,thead,tbody,tr,td{display:block}thead{display:none}
  tr{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
  td{border:0;padding:3px 0;display:flex;justify-content:space-between;gap:10px}
  td::before{content:attr(data-l);color:var(--hint);font-size:11.5px;font-weight:600}
  td.n{text-align:right}
  .tabs input{margin-left:0;max-width:none;width:100%}
}
#tbl{overflow-x:auto}
.empty{color:var(--hint);text-align:center;padding:20px;font-size:13px}
.note{font-size:12px;color:var(--hint);line-height:1.45}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--char);color:var(--gold);padding:11px 16px;border-radius:12px;font-weight:600;font-size:13.5px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal.show{display:flex}.modal img{max-width:100%;max-height:90vh;border-radius:12px}
.gate{max-width:520px;margin:60px auto;background:#fff;border-radius:var(--r);padding:24px;text-align:center;line-height:1.55}
.inv{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--hint)}
.inv b{color:var(--text)}
.dot{width:9px;height:9px;border-radius:50%;background:#bbb;display:inline-block}.dot.on{background:var(--green)}
</style>
</head>
<body>
<header><a class="back" href="/app?admin=1">‹ Admin</a><div class="brand">iSofa<small>WORLD OF FURNITURE</small></div><h1>Moliya</h1></header>
<main id="app"><div class="empty">Yuklanmoqda…</div></main>
<div class="modal" id="modal" onclick="this.classList.remove('show')"><img id="mImg" alt="Chek"></div>
<div class="toast" id="toast"></div>
<script>
"use strict";
const TG=window.Telegram&&window.Telegram.WebApp,IN_TG=!!(TG&&TG.initData);
if(TG){try{TG.ready();TG.expand();}catch(e){}}
const S={from:"",to:"",preset:"month",tab:"sales",q:"",data:null,form:{amount:"",cat:"reklama",day:"",note:"",file:null},busy:false};
const pad=n=>String(n).padStart(2,"0");
function today(){const d=new Date(Date.now()+5*3600e3);return d.toISOString().slice(0,10);}
function setPreset(p){S.preset=p;const t=today(),[y,m]=t.split("-").map(Number);
  if(p==="month"){S.from=`${y}-${pad(m)}-01`;S.to=t;}
  else if(p==="prev"){const py=m===1?y-1:y,pm=m===1?12:m-1,last=new Date(Date.UTC(py,pm,0)).getUTCDate();S.from=`${py}-${pad(pm)}-01`;S.to=`${py}-${pad(pm)}-${pad(last)}`;}
  else if(p==="q"){const d=new Date(Date.UTC(y,m-3,1));S.from=`${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-01`;S.to=t;}
  else if(p==="year"){S.from=`${y}-01-01`;S.to=t;}
  else if(p==="all"){S.from="2024-01-01";S.to=t;}
  load();}
const money=n=>(Math.round(n||0)).toLocaleString("ru-RU").replace(/ |,/g," ")+" so'm";
const short=n=>{const a=Math.abs(n||0);if(a>=1e6)return (n/1e6).toFixed(a>=1e8?0:1).replace(/\.0$/,"")+" mln";if(a>=1e3)return Math.round(n/1e3)+" ming";return String(Math.round(n||0));};
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const fmtDay=d=>{const [y,m,dd]=d.split("-");return `${dd}.${m}.${y}`;};
let tt;function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>e.classList.remove("show"),2800);}
async function api(url,opt){opt=opt||{};opt.headers=Object.assign({"X-Init-Data":(TG&&TG.initData)||""},opt.headers||{});opt.credentials="same-origin";
  const r=await fetch(url,opt);let j={};try{j=await r.json();}catch(e){}if(!r.ok){const e=new Error(j.error||"Xatolik yuz berdi");e.status=r.status;throw e;}return j;}
async function load(){
  try{S.data=await api(`/api/admin/finance?from=${S.from}&to=${S.to}`);render();}
  catch(e){if(e.status===401||e.status===403){document.getElementById("app").innerHTML=`<div class="gate"><h2 style="font-family:var(--serif);margin-top:0">Kirish kerak</h2>Bu sahifa faqat do'kon admini uchun.<br><br>
    Telegram'da botni oching va <b>/admin</b> → «💰 Moliya» tugmasini bosing.<br>Kompyuterda: botga <b>/panel</b> deb yozing, havolani oching, so'ng «💰 Moliya»ni tanlang.</div>`;}
    else {document.getElementById("app").innerHTML=`<div class="gate">⚠️ ${esc(e.message)}<br><br><button class="btn" onclick="load()">Qayta urinish</button></div>`;}}
}
function kpi(label,val,sub,cls){return `<div class="kpi ${cls||""}"><span>${label}</span><b class="${val<0?"neg":""}">${short(val)}</b><small>${sub||money(val)}</small></div>`;}
function chart(ms){
  const W=760,H=250,pl=48,pb=28,pt=12,cw=(W-pl-8)/ms.length,max=Math.max(1,...ms.map(m=>Math.max(m.income,m.cost+m.expenses))),min=Math.min(0,...ms.map(m=>m.net));
  const span=max-min,y=v=>pt+(H-pt-pb)*(max-v)/span,zero=y(0);
  let g="";for(let i=0;i<=4;i++){const v=min+span*i/4,yy=y(v);g+=`<line x1="${pl}" x2="${W-4}" y1="${yy}" y2="${yy}" stroke="#eee6d8"/><text x="${pl-6}" y="${yy+4}" font-size="10" text-anchor="end" fill="#8b8478">${short(v)}</text>`;}
  let bars="",pts=[];
  ms.forEach((m,i)=>{const x=pl+i*cw,bw=cw*.32;
    bars+=`<rect x="${x+cw*.14}" y="${y(m.income)}" width="${bw}" height="${Math.max(0,zero-y(m.income))}" rx="3" fill="#c9a24a"><title>${m.name}: tushum ${money(m.income)}</title></rect>`;
    const ce=m.cost+m.expenses;bars+=`<rect x="${x+cw*.14+bw+2}" y="${y(ce)}" width="${bw}" height="${Math.max(0,zero-y(ce))}" rx="3" fill="#b9b2a6"><title>${m.name}: tannarx+xarajat ${money(ce)}</title></rect>`;
    pts.push([x+cw/2,y(m.net)]);
    bars+=`<text x="${x+cw/2}" y="${H-10}" font-size="10" text-anchor="middle" fill="#8b8478">${m.name.slice(0,3)}</text>`;});
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const dots=pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="#363435"><title>${ms[i].name}: sof foyda ${money(ms[i].net)}</title></circle>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}">${g}<line x1="${pl}" x2="${W-4}" y1="${zero}" y2="${zero}" stroke="#cfc6b6"/>${bars}<path d="${line}" fill="none" stroke="#363435" stroke-width="2"/>${dots}</svg>
    <div class="legend"><span><i style="background:#c9a24a"></i>Tushum</span><span><i style="background:#b9b2a6"></i>Tannarx + xarajat</span><span><i style="background:#363435;border-radius:50%"></i>Sof foyda</span></div>`;}
function render(){
  const d=S.data,s=d.summary,margin=s.income?Math.round(s.net/s.income*100):0;
  const P=[["month","Bu oy"],["prev","O'tgan oy"],["q","3 oy"],["year","Bu yil"],["all","Hammasi"]];
  let h=`<div class="card"><div class="period">${P.map(([k,n])=>`<button class="${S.preset===k?"on":""}" onclick="setPreset('${k}')">${n}</button>`).join("")}
    <input type="date" value="${S.from}" onchange="S.from=this.value;S.preset='';load()"> — <input type="date" value="${S.to}" onchange="S.to=this.value;S.preset='';load()">
    <div class="acts">${IN_TG?`<button class="btn l" onclick="send('file')">📄 Excel faylni botga yuborish</button>`:`<a class="btn l" href="/api/admin/finance/csv?from=${S.from}&to=${S.to}">📄 Excel'ga yuklab olish</a>`}
    <button class="btn" onclick="send('investor')" ${d.investor?"":"disabled title='Sherik guruhi ulanmagan'"}>🤝 Sherikka hisobot</button></div></div>
    <div class="inv" style="margin-top:10px"><span class="dot ${d.investor?"on":""}"></span>${d.investor?"<b>Sherik guruhi ulangan</b> — savdolar, xarajatlar va hisobotlar avtomatik boradi.":"Sherik guruhi ulanmagan: guruh oching, botni qo'shing va guruhda <b>/sherik_guruhi</b> deb yozing."}</div></div>`;
  h+=`<div class="kpis">${kpi("Tushum",s.income,`${s.sales_n} ta savdo`)}${kpi("Tannarx",s.cost,"mahsulot va ustaxona")}${kpi("Yalpi foyda",s.gross)}${kpi("Xarajatlar",s.expenses,`${s.exp_n} ta`)}${kpi("Sof foyda",s.net,money(s.net),"main")}
    <div class="kpi"><span>Rentabellik</span><b class="${margin<0?"neg":""}">${margin}%</b><small>sof foyda / tushum</small></div></div>`;
  if(s.no_cost)h+=`<div class="note" style="padding:0 4px">ℹ️ ${s.no_cost} ta savdoda tannarx kiritilmagan (mahsulot kirim narxi yoki ustaxona to'lovi). Ularni admin panelda to'ldirsangiz, foyda aniqroq chiqadi.</div>`;
  const maxc=Math.max(1,...s.by_cat.map(c=>c.sum));
  h+=`<div class="grid2"><div class="card chart"><h2>Oylar bo'yicha <small>so'nggi 12 oy</small></h2>${chart(d.months)}</div>
    <div class="card"><h2>Xarajat turlari <small>${money(s.expenses)}</small></h2>${s.by_cat.length?`<div class="cats">${s.by_cat.map(c=>`<div class="catrow"><span>${c.name}</span><div class="bar"><i style="width:${c.sum/maxc*100}%"></i></div><b>${short(c.sum)}</b></div>`).join("")}</div>`:`<div class="empty">Bu davrda xarajat yo'q</div>`}
    ${d.pipeline.n?`<div class="pipe">⏳ <b>Jarayonda: ${d.pipeline.n} ta ish</b> — ${money(d.pipeline.sum)}${d.pipeline.prepay?`<br>Oldindan olingan: ${money(d.pipeline.prepay)}`:""}<br><span class="note">Yakunlanganda tushumga qo'shiladi.</span></div>`:""}</div></div>`;
  const F=S.form;
  h+=`<div class="card"><h2>Xarajat qo'shish <small>Sherik guruhiga avtomatik boradi</small></h2>
    <div class="f" style="margin-bottom:10px"><label>Turi</label><div class="chips">${d.cats.map(c=>`<button class="${F.cat===c.id?"on":""}" onclick="S.form.cat='${c.id}';render()">${c.name}</button>`).join("")}</div></div>
    <div class="form"><div class="f"><label>Summa (so'm)</label><input class="inp" id="fAmt" inputmode="numeric" placeholder="500 000" value="${esc(F.amount)}" oninput="fmtAmt(this)"></div>
    <div class="f"><label>Sana</label><input class="inp" type="date" id="fDay" value="${F.day||today()}" max="${today()}" onchange="S.form.day=this.value"></div>
    <div class="f wide"><label>Izoh</label><input class="inp" id="fNote" placeholder="Masalan: Instagram reklama, oktabr" value="${esc(F.note)}" oninput="S.form.note=this.value"></div>
    <div class="f wide"><label>Chek rasmi (ixtiyoriy)</label><input class="inp" type="file" accept="image/*" onchange="S.form.file=this.files[0]||null"></div>
    <div class="f wide"><button class="btn" style="justify-content:center;padding:13px" onclick="addExp()" ${S.busy?"disabled":""}>${S.busy?"Saqlanmoqda…":"＋ Xarajatni saqlash"}</button></div></div>
    <div class="note" style="margin-top:8px">Botda ham kiritish mumkin: <b>/xarajat 500000 reklama Instagram</b> (chek rasmi izohiga yozsangiz — rasm bilan saqlanadi).</div></div>`;
  h+=`<div class="card"><div class="tabs"><button class="${S.tab==="sales"?"on":""}" onclick="S.tab='sales';render()">💰 Savdolar (${d.sales.length})</button><button class="${S.tab==="exp"?"on":""}" onclick="S.tab='exp';render()">🧾 Xarajatlar (${d.expenses.length})</button>
    <input class="inp" placeholder="Qidirish: raqam, mahsulot, telefon, izoh…" value="${esc(S.q)}" oninput="S.q=this.value;renderTable()"></div><div id="tbl"></div></div>`;
  document.getElementById("app").innerHTML=h;renderTable();
}
function renderTable(){
  const d=S.data,q=S.q.trim().toLowerCase(),el=document.getElementById("tbl");if(!el)return;
  if(S.tab==="sales"){const rows=d.sales.filter(x=>!q||[x.id,x.items,x.phone,x.type].join(" ").toLowerCase().includes(q));
    if(!rows.length){el.innerHTML=`<div class="empty">Bu davrda yakunlangan savdo yo'q</div>`;return;}
    el.innerHTML=`<table><thead><tr><th>Sana</th><th>Turi</th><th>Raqam</th><th>Mahsulot</th><th>Mijoz telefoni</th><th class="n">Tushum</th><th class="n">Tannarx</th><th class="n">Foyda</th></tr></thead><tbody>${rows.map(x=>`<tr>
      <td data-l="Sana">${fmtDay(x.day)}</td><td data-l="Turi"><span class="tag ${x.kind==="c"?"c":""}">${x.type}</span></td><td data-l="Raqam">#${x.id}</td><td data-l="Mahsulot">${esc(x.items)}</td>
      <td data-l="Telefon"><a href="tel:${esc(x.phone)}" style="color:inherit">${esc(x.phone)}</a></td><td class="n" data-l="Tushum">${money(x.income)}</td>
      <td class="n" data-l="Tannarx">${x.cost?money(x.cost):`<span class="warn">kiritilmagan</span>`}</td><td class="n" data-l="Foyda"><b class="${x.profit<0?"neg":""}">${x.cost?money(x.profit):"—"}</b></td></tr>`).join("")}</tbody></table>`;}
  else{const rows=d.expenses.filter(x=>!q||[x.id,x.note,x.cat_name,x.by_name].join(" ").toLowerCase().includes(q));
    if(!rows.length){el.innerHTML=`<div class="empty">Bu davrda xarajat yo'q</div>`;return;}
    el.innerHTML=`<table><thead><tr><th>Sana</th><th>Raqam</th><th>Turi</th><th>Izoh</th><th>Kiritgan</th><th class="n">Summa</th><th></th></tr></thead><tbody>${rows.map(x=>`<tr>
      <td data-l="Sana">${fmtDay(x.day)}</td><td data-l="Raqam">#${x.id}</td><td data-l="Turi">${x.cat_name}</td><td data-l="Izoh">${esc(x.note)||"—"}</td><td data-l="Kiritgan">${esc(x.by_name)}</td>
      <td class="n" data-l="Summa"><b>${money(x.amount)}</b></td><td data-l="">${x.has_photo?`<button class="link" onclick="showPhoto(${x.id})">Chek</button> · `:""}<button class="del" onclick="delExp(${x.id})">O'chirish</button></td></tr>`).join("")}</tbody></table>`;}
}
function fmtAmt(el){const v=el.value.replace(/\D/g,"");el.value=v?Number(v).toLocaleString("ru-RU").replace(/ |,/g," "):"";S.form.amount=el.value;}
async function addExp(){
  const F=S.form,amt=F.amount.replace(/\D/g,"");if(!amt){toast("Summani kiriting");return;}
  S.busy=true;render();
  try{const fd=new FormData();fd.append("data",JSON.stringify({amount:amt,cat:F.cat,note:F.note,day:F.day||today()}));if(F.file)fd.append("photo",F.file,"chek.jpg");
    await api("/api/admin/finance/expense",{method:"POST",body:fd});S.form={amount:"",cat:F.cat,day:"",note:"",file:null};toast(S.data.investor?"Saqlandi va sherik guruhiga yuborildi":"Saqlandi");S.busy=false;S.tab="exp";await load();}
  catch(e){S.busy=false;render();toast("⚠️ "+e.message);}
}
async function delExp(id){
  const ok=IN_TG&&TG.showConfirm?await new Promise(r=>TG.showConfirm(`Xarajat #${id} o'chirilsinmi? Sherik guruhiga ham xabar boradi.`,r)):confirm(`Xarajat #${id} o'chirilsinmi? Sherik guruhiga ham xabar boradi.`);
  if(!ok)return;try{await api(`/api/admin/finance/expense/${id}/delete`,{method:"POST"});toast("O'chirildi");load();}catch(e){toast("⚠️ "+e.message);}
}
async function showPhoto(id){try{const r=await fetch(`/api/admin/finance/expense/${id}/photo`,{headers:{"X-Init-Data":(TG&&TG.initData)||""},credentials:"same-origin"});
  if(!r.ok)throw new Error("Chek rasmi topilmadi");document.getElementById("mImg").src=URL.createObjectURL(await r.blob());document.getElementById("modal").classList.add("show");}catch(e){toast("⚠️ "+e.message);}}
async function send(what){try{const j=await api(`/api/admin/finance/send?from=${S.from}&to=${S.to}`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({what})});toast(j.msg||"Yuborildi");}catch(e){toast("⚠️ "+e.message);}}
setPreset("month");
</script>
</body>
