<h2>🛋 Mebelix Do'koni</h2>

<!-- Mahsulotlar dinamik ravishda ushbu div ichiga joylashadi -->
<div class="grid" id="products-grid">
    <p style="text-align: center; width: 100%;">Mahsulotlar yuklanmoqda...</p>
</div>

<div class="cart">
    <h3>🛒 Savatcha</h3>
    <div id="cart-items">Savat bo'sh</div>
    <h4>Jami: <span id="total-price">0</span> so'm</h4>

    <input type="text" id="fullName" placeholder="Ismingiz">
    <input type="tel" id="phone" placeholder="Telefon raqamingiz">
    <button class="btn order-btn" type="button" onclick="submitOrder()">Buyurtma berish</button>
</div>

<script>
    let tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) {
        tg.expand();
        tg.ready();
    }

    let cart = [];
    let total = 0;

    // Serverdan mahsulotlarni yuklab olish funksiyasi
    async function loadProducts() {
        const grid = document.getElementById('products-grid');
        try {
            const res = await fetch('/api/products');
            const products = await res.json();

            if (!products || products.length === 0) {
                grid.innerHTML = '<p style="text-align: center; width: 100%;">Hozircha do\'konda mahsulotlar yo\'q.</p>';
                return;
            }

            grid.innerHTML = products.map(function(item) {
                // Rasm mavjud bo'lsa standart rasm yoki birinchi rasmini qo'yish
                let imgSrc = (item.photos && item.photos.length > 0) 
                    ? 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400' 
                    : 'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400';

                return 
                    <div class="card">
                        <img src="${imgSrc}" alt="${item.name}">
                        <h4>${item.name}</h4>
                        <p style="font-size: 12px; color: #666;">${item.description || ''}</p>
                        <div class="price">${item.price.toLocaleString()} so'm</div>
                        <button class="btn" type="button" onclick="addToCart('${item.name.replace(/'/g, "\\'")}', ${item.price})">Qo'shish</button>
                    </div>
                ;
            }).join('');
        } catch (err) {
            grid.innerHTML = '<p style="text-align: center; color: red;">Mahsulotlarni yuklashda xatolik yuz berdi!</p>';
        }
    }

    // Sahifa yuklanganda mahsulotlarni yuklash
    document.addEventListener('DOMContentLoaded', loadProducts);

    window.addToCart = function(name, price) {
        cart.push({ name: name, price: price });
        total += price;
        updateCart();
    };

    function updateCart() {
        const container = document.getElementById('cart-items');
        if (cart.length === 0) {
            container.innerHTML = "Savat bo'sh";
            document.getElementById('total-price').innerText = '0';
            return;
        }
        container.innerHTML = cart.map(function(item) {
            return '<div>• ' + item.name + ' - ' + item.price.toLocaleString() + ' so\'m</div>';
        }).join('');
        document.getElementById('total-price').innerText = total.toLocaleString();
    }

    window.submitOrder = async function() {
        const fullName = document.getElementById('fullName').value.trim();
        const phone = document.getElementById('phone').value.trim();

        if (!fullName || !phone) {
            alert("Iltimos, ismingiz va telefoningizni kiriting!");
            return;
        }
        if (cart.length === 0) {
            alert("Savatga kamida bitta mebel qo'shing!");
            return;
        }

        try {
            const response = await fetch('/api/order', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    orderData: {
                        fullName: fullName,
                        phone: phone,
                        cart: cart,
                        total: total
                    }
                })
            });
