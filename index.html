<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mebelix - Onlayn Do'kon</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #222222);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --button-color: var(--tg-theme-button-color, #2481cc);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: var(--tg-theme-secondary-bg-color, #f4f4f5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
        }

        .product-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 80px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-info h3 {
            margin: 0 0 6px 0;
            font-size: 16px;
        }

        .product-info p {
            margin: 0;
            font-size: 14px;
            color: var(--hint-color);
        }

        .counter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .counter button {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }

        .counter span {
            font-size: 16px;
            font-weight: bold;
            min-width: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Mebelix Katalogi</h2>

    <div class="product-list" id="product-list">
        <!-- Mahsulotlar dinamik ravishda qo'shiladi -->
    </div>

    <script>
        // Telegram Web App obyektini chaqirib olish
        const tg = window.Telegram.WebApp;
        tg.expand(); // Oynani to'liq ochish

        // Mahsulotlar ro'yxati
        const products = [
            { id: 1, name: "Ofis Stoli", price: 450000, quantity: 0 },
            { id: 2, name: "Yotoq To'plami", price: 2800000, quantity: 0 },
            { id: 3, name: "Mehmonxona Divani", price: 1900000, quantity: 0 },
            { id: 4, name: "Kiyim Shkafi", price: 1500000, quantity: 0 }
        ];

        const productListEl = document.getElementById('product-list');

        function renderProducts() {
            productListEl.innerHTML = '';
            products.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.innerHTML = `
                    <div class="product-info">
                        <h3>${product.name}</h3>
                        <p>${product.price.toLocaleString()} so'm</p>
                    </div>
                    <div class="counter">
                        <button onclick="updateQuantity(${product.id}, -1)">-</button>
                        <span>${product.quantity}</span>
                        <button onclick="updateQuantity(${product.id}, 1)">+</button>
                    </div>
                `;
                productListEl.appendChild(card);
            });
            updateMainButton();
        }

        function updateQuantity(id, delta) {
            const product = products.find(p => p.id === id);
            if (product) {
                product.quantity = Math.max(0, product.quantity + delta);
                renderProducts();
            }
        }

        function updateMainButton() {
            const totalItems = products.reduce((sum, p) => sum + p.quantity, 0);
            const totalPrice = products.reduce((sum, p) => sum + (p.price * p.quantity), 0);

            if (totalItems > 0) {
                tg.MainButton.text = `Buyurtma berish: ${totalPrice.toLocaleString()} so'm`;
                tg.MainButton.show();
            } else {
                tg.MainButton.hide();
            }
        }

        // Asosiy tugma bosilganda ishlaydigan funksiya
        Telegram.WebApp.onEvent('mainButtonClicked', function() {
            const orderData = products.filter(p => p.quantity > 0);
            // Ma'lumotlarni JSON formatida botga yuborish
            tg.sendData(JSON.stringify(orderData));
        });

        // Dastlabki yuklanish
        renderProducts();
    </script>
</body>
</html>
