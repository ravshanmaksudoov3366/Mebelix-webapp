services:
  - type: web
    name: mebelix
    runtime: docker
    plan: starter
    region: frankfurt
    healthCheckPath: /api/catalog
    disk:
      name: mebelix-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        value: "1027326101"
      - key: GROUP_ID
        value: "-1004481485199"
      - key: SHOP_NAME
        value: Mebelix
      - key: SHOP_PHONE
        value: "+998 99 333 33 66"
      - key: SHOP_ADDRESS
        value: ""
