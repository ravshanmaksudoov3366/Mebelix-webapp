<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>iSofa</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f3f1ee);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #1d1b19);
  --hint: var(--tg-theme-hint-color, #8d8780);
  --link: var(--tg-theme-link-color, #b4692f);
  --accent: var(--tg-theme-button-color, #b4692f);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #e0453a);
  --line: color-mix(in srgb, var(--hint) 22%, transparent);
  --soft: color-mix(in srgb, var(--accent) 12%, var(--card));
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg2); color: var(--text);
  font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(70px + env(safe-area-inset-bottom)); }
/* to'liq ekran rejimi: yuqoridagi Telegram tugmalari (yopish, menyu) uchun joy qoldiramiz */
:root { --top: 0px; }
body.fs { --top: calc(var(--tg-safe-area-inset-top, 0px) + var(--tg-content-safe-area-inset-top, 0px)); padding-top: var(--top); }
body.fs::before { content: ""; position: fixed; left: 0; right: 0; top: 0; height: var(--top); background: var(--bg); z-index: 7; }
body.fs header { top: var(--top); }
body.fs .sheet { max-height: calc(100% - var(--top) - 6px); }
body.fs .vbar { padding-top: calc(10px + var(--top)); }
body.fs .toast { top: calc(16px + var(--top)); }
button { font: inherit; color: inherit; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--text); }
.hidden { display: none !important; }
.muted { color: var(--hint); }
.small { font-size: 13px; }

/* header */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 10px;
  border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
.brand h1 { font-size: 19px; margin: 0; }
.brand a { color: var(--link); text-decoration: none; font-size: 14px; }
.search { display: flex; align-items: center; gap: 8px; background: var(--bg2); border-radius: 12px; padding: 0 12px; }
.search input { flex: 1; border: 0; background: none; padding: 10px 0; outline: none; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px 2px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; border: 0; background: var(--bg2); padding: 7px 13px; border-radius: 20px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-text); }

/* ikki eshik: tayyor mebel / o'lchamga buyurtma */
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg2); border-radius: 12px; padding: 4px; margin-bottom: 10px; }
.doors a, .doors button { text-align: center; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--hint); text-decoration: none; border: 0; background: none; }
.doors .on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.custom-cta { display: flex; gap: 12px; align-items: center; background: var(--soft); border-radius: var(--r); margin: 12px; padding: 14px; text-decoration: none; color: var(--text); }
.custom-cta .ic { font-size: 30px; }
.revs { display: flex; gap: 10px; overflow-x: auto; padding: 4px 12px 14px; scrollbar-width: none; }
.revs::-webkit-scrollbar { display: none; }
.rev { flex: none; width: 240px; background: var(--card); border-radius: var(--r); overflow: hidden; }
.rev img { width: 100%; height: 140px; object-fit: cover; display: block; }
.rev .b { padding: 10px 12px; font-size: 13.5px; }
.rev .s { color: #e0a526; letter-spacing: 1px; }
.rev q { display: block; margin: 6px 0; quotes: none; }
.asm-chk { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg2); cursor: pointer; font-size: 14.5px; }
.asm-chk input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 0; }
.change-box { background: var(--soft); border-radius: var(--r); margin: 12px; padding: 14px; }
.change-box b { display: block; font-size: 15.5px; margin-bottom: 4px; }
.change-box .acts { display: flex; gap: 8px; margin-top: 12px; }
.change-box .acts a { flex: 1; text-align: center; text-decoration: none; padding: 11px 8px; border-radius: 12px; font-weight: 600; font-size: 14.5px; }
.change-box .acts .call { background: var(--accent); color: var(--accent-text); }
.change-box .acts .write { background: var(--card); color: var(--link); }
.custom-cta b { display: block; }
/* catalog */
.toolbar { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px 0; }
.toolbar select { border: 0; background: none; color: var(--link); font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(155px, 1fr)); gap: 10px; padding: 10px 12px 14px; }
.card { background: var(--card); border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.ph { position: relative; aspect-ratio: 1; background: linear-gradient(140deg, #efe2d3, #dcc5ad);
  display: grid; place-items: center; font-size: 58px; overflow: hidden; }
.ph img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.badge { position: absolute; left: 8px; top: 8px; background: var(--danger); color: #fff; font-size: 12px;
  font-weight: 700; padding: 2px 7px; border-radius: 8px; z-index: 1; }
.oos { position: absolute; inset: auto 0 0 0; background: rgba(0,0,0,.55); color: #fff; font-size: 12px;
  text-align: center; padding: 4px; z-index: 1; }
.card .body { padding: 9px 10px 10px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.pname { font-size: 14px; font-weight: 600; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden; }
.price { font-weight: 700; color: var(--text); }
.old { color: var(--hint); text-decoration: line-through; font-size: 12px; font-weight: 400; margin-left: 4px; }
.btn { border: 0; border-radius: 12px; padding: 10px 14px; background: var(--accent); color: var(--accent-text);
  font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.soft { background: var(--soft); color: var(--link); }
.btn.ghost { background: var(--bg2); color: var(--text); }
.btn.danger { background: color-mix(in srgb, var(--danger) 12%, var(--card)); color: var(--danger); }
.btn.block { width: 100%; }
.btn.sm { padding: 7px 10px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: .5; }
.card .btn { margin-top: auto; padding: 8px; }
.stepper { margin-top: auto; display: flex; align-items: center; justify-content: space-between;
  background: var(--soft); border-radius: 12px; }
.stepper button { border: 0; background: none; width: 40px; height: 36px; font-size: 20px; font-weight: 700; color: var(--link); }
.stepper b { min-width: 24px; text-align: center; }
.empty { text-align: center; padding: 50px 24px; color: var(--hint); }
.empty .big { font-size: 54px; margin-bottom: 8px; }

/* sections */
.section { background: var(--card); border-radius: var(--r); margin: 12px; padding: 14px; }
.section h3 { margin: 0 0 10px; font-size: 16px; }
.title { padding: 16px 16px 0; font-size: 20px; font-weight: 700; margin: 0; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.row:last-child { border-bottom: 0; }
.thumb { width: 56px; height: 56px; border-radius: 12px; flex: none; overflow: hidden; display: grid; place-items: center;
  font-size: 28px; background: linear-gradient(140deg, #efe2d3, #dcc5ad); position: relative; }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.grow { flex: 1; min-width: 0; }
.row .stepper { width: 108px; margin: 0; flex: none; }
.sum { display: flex; justify-content: space-between; padding: 6px 0; }
.sum.total { font-size: 18px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 12px; }
.x { border: 0; background: none; color: var(--hint); font-size: 18px; padding: 4px; }

/* orders */
.order { background: var(--card); border-radius: var(--r); margin: 12px; padding: 14px; }
.ohead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.status { font-size: 13px; padding: 3px 9px; border-radius: 10px; background: var(--bg2); white-space: nowrap; }
.status.new { background: #fff1d6; color: #9a6400; } .status.confirmed { background: #dff3e4; color: #1f7a3a; }
.status.delivering { background: #dcebff; color: #1d5fb8; } .status.done { background: #e9e6ff; color: #4b3fb3; }
.status.delivered { background: #d9f2f2; color: #0f6b6b; } .status.assembled { background: #f3e6d6; color: #8a4d14; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.35; }
.chk input { width: 22px; height: 22px; flex: none; margin: 0; accent-color: var(--accent); }
.offer h2 { font-size: 18px; margin: 0 0 4px; } .offer h3 { font-size: 15px; margin: 14px 0 4px; } .offer p { margin: 6px 0; font-size: 14px; line-height: 1.45; }
.tl { font-size: 13px; } .tl div { padding: 3px 0; border-bottom: 1px dashed var(--line); }
.status.cancelled, .status.rejected { background: #fde3e1; color: #b3261e; }
.track { display: flex; gap: 4px; margin: 10px 0 4px; }
.track span { flex: 1; height: 4px; border-radius: 2px; background: var(--line); }
.track span.on { background: var(--accent); }
.olines { font-size: 14px; color: var(--hint); margin: 6px 0; }

/* bottom nav */
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; background: var(--bg); border-top: 1px solid var(--line);
  display: flex; padding-bottom: env(safe-area-inset-bottom); }
nav button { flex: 1; border: 0; background: none; padding: 8px 0 7px; display: flex; flex-direction: column;
  align-items: center; gap: 2px; font-size: 11px; color: var(--hint); position: relative; }
nav button .ic { font-size: 21px; line-height: 1; filter: grayscale(1); opacity: .75; }
nav button.on { color: var(--link); } nav button.on .ic { filter: none; opacity: 1; }
nav .cnt { position: absolute; top: 3px; left: calc(50% + 6px); background: var(--danger); color: #fff; font-size: 11px;
  font-weight: 700; min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }
body.tg nav.in-sheet { display: none; }

/* sheets */
.shade { position: fixed; inset: 0; background: rgba(0,0,0,.42); z-index: 20; opacity: 0; pointer-events: none; transition: opacity .2s; }
.shade.on { opacity: 1; pointer-events: auto; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--bg2); border-radius: 20px 20px 0 0;
  max-height: 92vh; overflow-y: auto; transform: translateY(105%); transition: transform .25s ease;
  padding-bottom: calc(90px + env(safe-area-inset-bottom)); overscroll-behavior: contain; }
.sheet.on { transform: none; }
.sheet .grab { position: sticky; top: 0; z-index: 2; background: var(--bg2); padding: 8px 16px 6px;
  display: flex; align-items: center; justify-content: space-between; }
.sheet .grab::before { content: ""; position: absolute; left: 50%; top: 6px; width: 38px; height: 4px; margin-left: -19px;
  border-radius: 2px; background: var(--line); }
.sheet .grab h2 { font-size: 18px; margin: 10px 0 2px; }
.close { border: 0; background: var(--card); width: 32px; height: 32px; border-radius: 50%; font-size: 16px; margin-top: 6px; }
.gallery { display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; background: var(--card); }
.gallery::-webkit-scrollbar { display: none; }
.gallery > div { flex: 0 0 100%; scroll-snap-align: center; aspect-ratio: 4/3; display: grid; place-items: center;
  font-size: 110px; background: linear-gradient(140deg, #efe2d3, #dcc5ad); }
.gallery img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; }
.gallery > div { position: relative; }
.gallery > .vid { background: #000; display: block; position: relative; overflow: hidden; min-height: 0; }
.gallery video, .gallery iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block;
  background: #000; object-fit: contain; }
.dots i.v { background: #e0453a55; }
.dots i.v.on { background: var(--danger); }
.vbadge { position: absolute; right: 8px; top: 8px; z-index: 1; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,.55);
  color: #fff; font-size: 12px; display: grid; place-items: center; }
.vprev { width: 100%; max-height: 260px; border-radius: 12px; background: #000; display: block; }
.zoom-hint { position: absolute; right: 10px; bottom: 10px; background: rgba(0,0,0,.5); color: #fff; font-size: 15px;
  width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; pointer-events: none; }

/* rasm ko'ruvchi */
.viewer { position: fixed; inset: 0; z-index: 60; background: #000; display: flex; flex-direction: column; }
.viewer.hidden { display: none; }
.vbar { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between;
  padding: calc(10px + env(safe-area-inset-top)) 12px 10px; background: linear-gradient(rgba(0,0,0,.6), transparent); color: #fff; }
.vbar button { border: 0; background: rgba(255,255,255,.16); color: #fff; border-radius: 20px; padding: 8px 14px; font-weight: 600; }
.vbar .vclose { width: 38px; height: 38px; padding: 0; border-radius: 50%; font-size: 17px; }
.vtrack { flex: 1; display: flex; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; touch-action: pan-x; }
.vtrack::-webkit-scrollbar { display: none; }
.vtrack.zoomed { overflow: hidden; touch-action: none; }
.vtrack.zoomed ~ .vhint { display: none; }
.vslide { flex: 0 0 100%; height: 100%; scroll-snap-align: center; display: grid; place-items: center; overflow: hidden; }
.vslide img { max-width: 100%; max-height: 100%; transform-origin: center center; user-select: none; -webkit-user-drag: none;
  will-change: transform; transition: transform .15s ease; }
.vslide img.drag { transition: none; }
.vhint { position: absolute; left: 0; right: 0; bottom: calc(14px + env(safe-area-inset-bottom)); text-align: center;
  color: rgba(255,255,255,.7); font-size: 13px; pointer-events: none; }
.dots { display: flex; justify-content: center; gap: 6px; padding: 8px 0 0; }
.dots i { width: 6px; height: 6px; border-radius: 3px; background: var(--line); }
.dots i.on { background: var(--accent); width: 16px; }
.specs { width: 100%; border-collapse: collapse; font-size: 14px; }
.specs td { padding: 8px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.specs td:first-child { color: var(--hint); width: 45%; padding-right: 10px; }
.specs tr:last-child td { border-bottom: 0; }

/* forms */
label.f { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 5px; }
label.f:first-child { margin-top: 0; }
.in { width: 100%; border: 0; border-radius: 12px; background: var(--bg2); padding: 12px; outline: none; font-size: 16px; }
textarea.in { resize: vertical; min-height: 72px; }
.in:focus { box-shadow: 0 0 0 2px var(--accent) inset; }
.seg { display: flex; background: var(--bg2); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; border: 0; background: none; padding: 9px 6px; border-radius: 10px; font-size: 14px; }
.seg button.on { background: var(--card); font-weight: 600; box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.opts { display: flex; flex-wrap: wrap; gap: 8px; }
.opts button { border: 1.5px solid var(--line); background: var(--card); padding: 8px 12px; border-radius: 12px; font-size: 14px; }
.opts button.on { border-color: var(--accent); background: var(--soft); color: var(--link); font-weight: 600; }
.inrow { display: flex; gap: 8px; }
.inrow .in { flex: 1; }
.err { color: var(--danger); font-size: 14px; margin: 10px 2px 0; min-height: 0; }
.switch { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; }
.switch input { width: 44px; height: 26px; accent-color: var(--accent); }
.imgs { display: flex; flex-wrap: wrap; gap: 8px; }
.imgs .thumb { width: 76px; height: 76px; }
.imgs .thumb .x { position: absolute; top: 2px; right: 2px; background: rgba(0,0,0,.55); color: #fff; width: 22px; height: 22px;
  border-radius: 50%; font-size: 12px; padding: 0; display: grid; place-items: center; }
.imgs .thumb .star { position: absolute; left: 2px; bottom: 2px; background: rgba(0,0,0,.55); color: #ffd54a; width: 24px; height: 24px;
  border: 0; border-radius: 50%; font-size: 13px; padding: 0; display: grid; place-items: center; }
.imgs .main-tag { position: absolute; left: 0; right: 0; bottom: 0; background: var(--accent); color: var(--accent-text);
  font-size: 10px; font-weight: 700; text-align: center; padding: 2px 0; }
.addimg { position: relative; overflow: hidden; margin-top: 10px; }
.addimg input { position: absolute; inset: 0; opacity: 0; }
.imgs .add { width: 76px; height: 76px; border-radius: 12px; border: 1.5px dashed var(--hint); display: grid; place-items: center;
  color: var(--hint); font-size: 26px; background: none; position: relative; overflow: hidden; }
.imgs .add input { position: absolute; inset: 0; opacity: 0; }

/* admin */
.srow { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0 4px; font-size: 14.5px; }
.sbar { height: 8px; border-radius: 6px; background: var(--bg2); overflow: hidden; display: flex; margin-bottom: 4px; }
.sbar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.sbar i.alt, .dot.alt { background: #4f8a6e; }
.sbar.two i { border-radius: 0; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); vertical-align: middle; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px; }
.stat { background: var(--card); border-radius: 14px; padding: 10px; }
.stat b { display: block; font-size: 18px; }
.stat span { font-size: 12px; color: var(--hint); }
.adm-tabs { margin: 12px 12px 0; }
.list-card { background: var(--card); border-radius: var(--r); margin: 10px 12px; padding: 4px 14px; }
.tag { font-size: 11px; padding: 2px 6px; border-radius: 6px; background: var(--bg2); color: var(--hint); margin-left: 4px; }
.tag.red { background: #fde3e1; color: #b3261e; }

.dd { font-size: 12px; color: var(--hint); }
.free { color: #1f9d55; font-weight: 700; }
.free-box { background: color-mix(in srgb, #1f9d55 12%, var(--card)); color: #1a7f46; font-weight: 600; margin-top: 8px; }
.ddbox { margin-top: 10px; background: var(--soft); border-radius: 10px; padding: 8px 10px; font-size: 14px; }

/* checkout */
.stepno { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent);
  color: var(--accent-text); font-size: 13px; margin-right: 8px; vertical-align: 1px; }
.geo-ok { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--soft); border-radius: 12px; padding: 10px 12px; }
.paybox { background: var(--bg2); border-radius: 14px; padding: 12px 14px; margin-top: 10px; }
.payamt { font-size: 24px; font-weight: 800; }
.cardrow { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cardno { font-size: 17px; font-weight: 700; letter-spacing: .5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.upl { position: relative; overflow: hidden; }
.upl input { position: absolute; inset: 0; opacity: 0; }
.rcpt { display: flex; align-items: center; gap: 12px; margin-top: 12px; background: var(--soft); border-radius: 12px; padding: 8px; }
.rcpt-big { text-align: center; color: var(--hint); font-size: 14px; }
.rcpt-big img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 12px; background: var(--bg2); display: block; margin-bottom: 6px; }
.rcpt img { width: 64px; height: 64px; object-fit: cover; border-radius: 10px; }
.mpsearch { position: relative; margin: 0 12px 10px; display: flex; align-items: center; gap: 8px; background: var(--card);
  border-radius: 12px; padding: 0 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
.mpsearch input { flex: 1; border: 0; background: none; padding: 12px 0; outline: none; font-size: 16px; }
.mpres { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 1000; background: var(--card); border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 46vh; overflow-y: auto; }
.mpitem { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; font-size: 15px; }
.mpitem:last-child { border-bottom: 0; }
.mapwrap { position: relative; margin: 0 12px; border-radius: 16px; overflow: hidden; }
#map { height: 58vh; min-height: 300px; background: #e8e4dc; }
.pin { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -100%); font-size: 40px; z-index: 500; pointer-events: none;
  filter: drop-shadow(0 3px 3px rgba(0,0,0,.35)); }
.locbtn { position: absolute; right: 10px; bottom: 10px; z-index: 500; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
.chips.adm { margin: 0; padding: 12px 12px 0; }
.avatar { width: 44px; height: 44px; border-radius: 50%; font-size: 18px; font-weight: 700; color: var(--accent-text);
  background: var(--accent); }

/* success */
.done { text-align: center; padding: 30px 20px 10px; }

  "Navoiy": "Навои", "Qashqadaryo": "Кашкадарья", "Qoraqalpog'iston": "Каракалпакстан", "Samarqand": "Самарканд",
  "Sirdaryo": "Сырдарья", "Surxondaryo": "Сурхандарья" };
const urlLang = new URLSearchParams(location.search).get("lang");
const normLang = l => String(l || "").toLowerCase().startsWith("ru") ? "ru" : "uz";
let LANG = normLang(urlLang || (function () { try { return JSON.parse(localStorage.getItem("lang")); } catch (e) { return ""; } })()
  || (window.Telegram && Telegram.WebApp.initDataUnsafe && Telegram.WebApp.initDataUnsafe.user && Telegram.WebApp.initDataUnsafe.user.language_code));
function t(key, vars) {
  if (!IN_TG && I18N.uz[key + "_web"]) key += "_web";  // saytdan ochilganda «bot» o'rniga «telefon»
  let s = (I18N[LANG] && I18N[LANG][key]) ?? I18N.uz[key] ?? key;
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(vars[k]);
  return s;
}
const cityName = c => LANG === "ru" ? (CITY_RU[c] || c) : c;
const payName = p => LANG === "ru" ? ((S.paymentsRu || {})[p] || p) : p;
function applyStatic() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("[data-tph]").forEach(el => el.placeholder = t(el.dataset.tph));
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  const tc = document.getElementById("toCustom"); if (tc) tc.href = "/custom?lang=" + LANG;
}

/* ------------------------------------------------ yordamchilar */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " " + t("som");
const haptic = (t = "light") => { try { tg.HapticFeedback.impactOccurred(t); } catch (e) {} };
const notifyH = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
function toast(msg) {
  const t = document.createElement("div"); t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}
function alertBox(msg) { return new Promise(r => { if (IN_TG && tg.showAlert) tg.showAlert(msg, r); else { alert(msg); r(); } }); }
function confirmBox(msg) { return new Promise(r => { if (IN_TG && tg.showConfirm) tg.showConfirm(msg, r); else r(confirm(msg)); }); }
const dateStr = ts => { const d = new Date(ts * 1000); return d.toLocaleDateString("ru-RU") + " " + d.toTimeString().slice(0, 5); };
const picHTML = (p, cls = "ph") => {
  const img = (p.images && p.images[0]) || p.image || (p.video && p.video.poster);  // rasm bo'lmasa — video posteri
  return img ? `<img src="${esc(img)}" loading="lazy" alt="">` : esc(p.emoji || "🪑");
};

async function api(path, { method = "GET", json, form } = {}) {
  const opt = { method, headers: { "X-Init-Data": (tg && tg.initData) || "", "X-Lang": LANG } };
  if (!IN_TG && store.get("wtok", "")) opt.headers["X-Web-Token"] = store.get("wtok", "");
  if (json) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(json); }
  if (form) { opt.method = "POST"; opt.body = form; }
  if (method === "POST" && !opt.body) opt.body = "{}";
  let res;
  try { res = await fetch(path, opt); } catch (e) { throw new Error(t("net_err")); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || t("gen_err"));
  return data;
}

/* ------------------------------------------------ holat */
const S = {
  shop: {}, cats: [], products: [], payments: [],
  me: { is_admin: false, orders: [], profile: {} },
  cart: store.get("cart", {}),                 // {productId: qty}
  tab: "catalog", cat: 0, q: "", sort: store.get("sort", "new"),
  adm: { tab: "orders", status: "active", data: null, pq: "", cust: null, cq: "" },
  sheets: [],                                  // ochiq oynalar steki
};
const prod = id => S.products.find(p => p.id === +id);
const cartItems = () => Object.entries(S.cart).map(([id, qty]) => ({ p: prod(id), qty })).filter(i => i.p);
const cartCount = () => cartItems().reduce((s, i) => s + i.qty, 0);
const cartTotal = () => cartItems().reduce((s, i) => s + i.p.price * i.qty, 0);

function setQty(id, qty) {
  qty = Math.max(0, Math.min(99, qty));
  if (qty > (S.cart[id] || 0)) { const p = prod(id); if (p) px("AddToCart", { content_ids: [String(id)], content_type: "product", value: p.price * (qty - (S.cart[id] || 0)), currency: "UZS" }); }
  if (qty) S.cart[id] = qty; else delete S.cart[id];
  store.set("cart", S.cart); haptic(); refresh();
}
function cleanCart() {             // sotuvdan olingan mahsulotlarni savatchadan olib tashlash
  for (const id of Object.keys(S.cart)) if (!prod(id) || !prod(id).in_stock) delete S.cart[id];
  store.set("cart", S.cart);
}
const stepper = id => `<div class="stepper" onclick="event.stopPropagation()">
  <button onclick="setQty(${id}, ${(S.cart[id] || 0) - 1})">−</button><b>${S.cart[id]}</b>
  <button onclick="setQty(${id}, ${(S.cart[id] || 0) + 1})">+</button></div>`;
const buyBtn = p => !p.in_stock ? `<button class="btn ghost" disabled>${t("oos")}</button>`
  : S.cart[p.id] ? stepper(p.id)
  : `<button class="btn" onclick="event.stopPropagation(); setQty(${p.id}, 1)">${t("to_cart")}</button>`;
const short = n => n >= 1e9 ? (n / 1e9).toFixed(1).replace(".0", "") + " mlrd" : n >= 1e6 ? (n / 1e6).toFixed(1).replace(".0", "") + " mln" : Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ");
const ACTIONS = { new: "🔄 Qayta ochish", confirmed: "✅ Tasdiqlash", delivering: "🚚 Yo'lga chiqarish", done: "📦 Yetkazildi", cancelled: "❌ Bekor qilish" };
const discount = p => p.old_price > p.price ? Math.round((1 - p.price / p.old_price) * 100) : 0;

/* ------------------------------------------------ ko'rinishlar */
function render() {
  document.body.classList.toggle("wide", !IN_TG && S.tab === "admin");
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  $("#hdr").classList.toggle("hidden", S.tab !== "catalog");
  const v = $("#view");
  if (S.tab === "catalog") v.innerHTML = viewCatalog();
  else if (S.tab === "cart") v.innerHTML = viewCart();
  else if (S.tab === "orders") v.innerHTML = viewOrders();
  else if (S.tab === "admin") v.innerHTML = viewAdmin();
  const n = cartCount();
  $("#cartCnt").textContent = n; $("#cartCnt").classList.toggle("hidden", !n);
  const nn = S.adm.data ? S.adm.data.stats.new : 0;
  $("#newCnt").textContent = nn; $("#newCnt").classList.toggle("hidden", !nn);
  updateMain();
}
function refresh() {           // ochiq oynani ham yangilash
  render();
  const top = S.sheets[S.sheets.length - 1];
  if (top && top.rerender) top.el.querySelector(".sb").innerHTML = top.rerender();
  updateMain();
}

function renderCats() {
  $("#cats").innerHTML = [{ id: 0, name: t("all"), emoji: "" }, ...S.cats.filter(c => S.products.some(p => p.cat_id === c.id))]
    .map(c => `<button class="chip ${S.cat === c.id ? "on" : ""}" data-cat="${c.id}">${esc(c.emoji)} ${esc(c.name)}</button>`).join("");
}

function viewCatalog() {
  const q = S.q.trim().toLowerCase();
  let list = S.products.filter(p => (!S.cat || p.cat_id === S.cat) &&
    (!q || (p.name + " " + p.description).toLowerCase().includes(q)));
  const sorters = { new: (a, b) => b.created - a.created, cheap: (a, b) => a.price - b.price,
    exp: (a, b) => b.price - a.price, sale: (a, b) => discount(b) - discount(a) };
  list.sort(sorters[S.sort] || sorters.new);
  list.sort((a, b) => b.in_stock - a.in_stock);
  const tools = `<div class="toolbar"><span class="muted small">${t("n_products", { n: list.length })}</span>
    <select onchange="S.sort=this.value; store.set('sort', this.value); render()">
      ${[["new", t("sort_new")], ["cheap", t("sort_cheap")], ["exp", t("sort_exp")], ["sale", t("sort_sale")]]
        .map(([k, t]) => `<option value="${k}" ${S.sort === k ? "selected" : ""}>${t}</option>`).join("")}
    </select></div>`;
  if (!list.length) return tools + `<div class="empty"><div class="big">🔎</div>${t("nothing")}</div>`;
  return tools + `<div class="grid">` + list.map(p => `
    <div class="card" onclick="openProduct(${p.id})">
      <div class="ph">${discount(p) ? `<span class="badge">−${discount(p)}%</span>` : ""}${(p.video && p.video.src) || p.youtube ? `<span class="vbadge">▶</span>` : ""}${picHTML(p)}
        ${!p.in_stock ? `<span class="oos">${t("oos")}</span>` : ""}</div>
      <div class="body"><div class="pname">${esc(p.name)}</div>
        <div><span class="price">${money(p.price)}</span>${p.old_price > p.price ? `<br><span class="old" style="margin:0">${money(p.old_price)}</span>` : ""}</div>
        ${p.delivery_days ? `<div class="dd">🚚 ${esc(p.delivery_days)}</div>` : ""}
        ${buyBtn(p)}</div>
    </div>`).join("") + `</div>` + (!q && !S.cat ? reviewsHTML() : "");
}
function reviewsHTML() {
  const R = S.reviews || [];
  if (!R.length) return "";
  return `<div class="toolbar" style="margin-top:6px"><b>${t("rev_t")}</b>${(S.reviewsSum || {}).count ? `<span class="muted small">${t("rev_avg", { a: S.reviewsSum.avg, n: S.reviewsSum.count })}</span>` : ""}</div><div class="revs">${R.map(r => `<div class="rev">${r.photo ? `<img src="${esc(r.photo)}" alt="" loading="lazy">` : ""}
    <div class="b"><div class="s">${"★".repeat(r.rating)}<span class="muted">${"★".repeat(5 - r.rating)}</span></div>
    ${r.text ? `<q>${esc(r.text)}</q>` : ""}<div class="small muted">${esc(r.name)} · ${esc(r.date)}</div></div></div>`).join("")}</div>`;
}


function viewCart() {
  const items = cartItems();
  if (!items.length) return `<h2 class="title">${t("nav_cart")}</h2><div class="empty"><div class="big">🛒</div>
    ${t("cart_empty")}<br><br><button class="btn" onclick="go('catalog')">${t("go_catalog")}</button></div>`;
  return `<h2 class="title">${t("nav_cart")}</h2><div class="section">` + items.map(({ p, qty }) => `
    <div class="row" onclick="openProduct(${p.id})">
      <div class="thumb">${picHTML(p)}</div>
      <div class="grow"><div class="pname">${esc(p.name)}</div>
        <div class="small muted">${money(p.price)}${qty > 1 ? " × " + qty : ""}</div>
        <div class="price">${money(p.price * qty)}</div>
        ${p.delivery_days ? `<div class="dd">🚚 ${esc(p.delivery_days)}</div>` : ""}</div>
      ${stepper(p.id)}
    </div>`).join("") + `</div>
    <div class="section"><div class="sum"><span class="muted">${t("items_n", { n: cartCount() })}</span><span>${money(cartTotal())}</span></div>
      <div class="sum"><span class="muted">${t("delivery")}</span><span class="free">${t("by_manager")}</span></div>
      <div class="sum total"><span>${t("total")}</span><span>${money(cartTotal())}</span></div></div>
    <div style="padding:0 12px"><button class="btn ghost block" onclick="clearCart()">${t("clear_cart")}</button></div>`;
}
async function clearCart() { if (await confirmBox(t("clear_q"))) { S.cart = {}; store.set("cart", {}); render(); } }

const trackOf = o => ["new", "confirmed"].concat(o.delivery === "pickup" ? [] : ["delivering", "delivered"],
  o.assembly ? ["assembled"] : [], ["done"]);
const awaitingAccept = o => o.status === (o.assembly ? "assembled" : "delivered");
function orderCard(o, admin = false) {
  const TRACK = trackOf(o), step = TRACK.indexOf(o.status);
  const names = o.items.map(i => `${esc(i.name)} × ${i.qty}`).join(", ");
  return `<div class="order" ${admin ? `onclick="openAdminOrder(${o.id})"` : ""}>
    <div class="ohead"><b>№ ${o.id}${admin ? " · " + esc(o.name) : ""}</b><span class="status ${o.status}">${esc(o.status_text)}</span></div>
    <div class="small muted">${dateStr(o.created)}${admin ? " · " + esc(o.phone) : ""}</div>
    ${step >= 0 ? `<div class="track">${TRACK.map((_, i) => `<span class="${i <= step ? "on" : ""}"></span>`).join("")}</div>` : ""}
    <div class="olines">${names}</div>
    ${o.prepay ? `<div class="small muted">${admin ? `💰 Oldindan to'lov: ${money(o.prepay)} · Qolgan: ${money(o.total - o.prepay)}` : t("prepay_line", { a: money(o.prepay), b: money(o.total - o.prepay) })}</div>` : ""}
    ${!admin && o.status === "new" ? `<div class="small" style="margin-top:6px">${t("check_wait")}</div>` : ""}
    ${!admin && o.status === "rejected" ? `<div class="small err" style="margin-top:6px">${t("check_rej")}</div>` : ""}
    ${!admin && awaitingAccept(o) ? `<div class="small" style="margin-top:8px">${t("accept_hint")}</div>
      <button class="btn block" style="margin-top:8px" onclick="acceptOrder(${o.id})">${t("accept_btn")}</button>` : ""}
    <div class="ohead" style="margin:6px 0 0"><b>${money(o.total)}</b>
      ${!admin && ["done", "cancelled", "rejected"].includes(o.status) ? `<button class="btn soft sm" onclick="repeatOrder(${o.id})">${t("repeat")}</button>` : ""}
    </div></div>`;
}
async function acceptOrder(id) {
  if (!await confirmBox(t("accept_q"))) return;
  try { await api(`/api/order/${id}/accept`, { method: "POST" }); notifyH("success"); toast(t("accepted"));
        await loadMe(); render(); }
  catch (e) { alertBox(e.message); }
}
function viewOrders() {
  const list = S.me.orders || [];
  const adm = S.shop.admin ? `<a class="tel" href="https://t.me/${esc(S.shop.admin)}" onclick="openUrl(this.href); return false">@${esc(S.shop.admin)}</a>` : "";
  const contact = [adm && t("questions_admin", { admin: adm }),
    S.shop.phone && t("questions", { phone: `<a class="tel" href="tel:${esc(S.shop.phone.replace(/[^\d+]/g, ""))}">${esc(S.shop.phone)}</a>` })]
    .filter(Boolean).map(x => `<div class="section small">${x}</div>`).join("");
  if (!list.length) return `<h2 class="title">${t("nav_orders")}</h2><div class="empty"><div class="big">📦</div>${t("no_orders")}</div>` + contact;
  return `<h2 class="title">${t("nav_orders")}</h2>` + list.map(o => orderCard(o)).join("") + contact;
}
async function cancelOrder(id) {
  if (!await confirmBox(`№${id} buyurtmani bekor qilasizmi?`)) return;
  try { await api(`/api/order/${id}/cancel`, { method: "POST" }); await loadMe(); toast("Buyurtma bekor qilindi"); render(); }
  catch (e) { alertBox(e.message); }
}
function repeatOrder(id) {
  const o = S.me.orders.find(x => x.id === id); let added = 0;
  o.items.forEach(i => { const p = prod(i.id); if (p && p.in_stock) { S.cart[i.id] = (S.cart[i.id] || 0) + i.qty; added++; } });
  store.set("cart", S.cart);
  if (!added) return alertBox(t("not_avail"));
  toast(t("added")); go("cart");
}

/* ------------------------------------------------ oynalar (sheet) */
function openSheet({ title = "", body, rerender, main, onClose }) {
  const el = document.createElement("div");
  el.className = "sheet";
  el.innerHTML = `<div class="grab"><h2>${esc(title)}</h2><button class="close" aria-label="${t("close")}">✕</button></div><div class="sb"></div>`;
  el.querySelector(".sb").innerHTML = rerender ? rerender() : body;
  el.querySelector(".close").onclick = closeSheet;
  $("#sheets").appendChild(el);
  const sh = { el, rerender, main, onClose };
  S.sheets.push(sh);
  requestAnimationFrame(() => { el.classList.add("on"); $("#shade").classList.add("on"); });
  $("#nav").classList.add("in-sheet");
  if (tg && tg.BackButton) tg.BackButton.show();
  updateMain();
  return sh;
}
function closeSheet() {
  const sh = S.sheets.pop(); if (!sh) return;
  sh.el.classList.remove("on"); setTimeout(() => sh.el.remove(), 260);
  if (sh.onClose) sh.onClose();
  if (!S.sheets.length) { $("#shade").classList.remove("on"); $("#nav").classList.remove("in-sheet"); }
  updateBack(); updateMain();
}
function closeAll() { while (S.sheets.length) closeSheet(); }
function updateBack() { if (tg && tg.BackButton) (S.sheets.length || S.tab !== "catalog") ? tg.BackButton.show() : tg.BackButton.hide(); }

/* ------------------------------------------------ asosiy tugma */
let mainHandler = null;
function setMain(text, fn) {
  mainHandler = fn;
  if (IN_TG) {
    if (text) tg.MainButton.setParams({ text, is_visible: true, is_active: true }); else tg.MainButton.hide();
  } else {
    const b = $("#fallback"); b.textContent = text || ""; b.classList.toggle("hidden", !text);
    b.style.bottom = S.sheets.length ? "calc(14px + env(safe-area-inset-bottom))" : "";
  }
}
function updateMain() {
  if (typeof V !== "undefined" && V.open) return setMain(null);
  const top = S.sheets[S.sheets.length - 1];
  if (top) return top.main ? setMain(...top.main()) : setMain(null);
  const n = cartCount();
  if (S.tab === "catalog" && n) return setMain(t("main_cart", { n, sum: money(cartTotal()) }), () => go("cart"));
  if (S.tab === "cart" && n) return setMain(t("main_checkout", { sum: money(cartTotal()) }), openCheckout);
  setMain(null);
}
function mainBusy(on) { if (IN_TG) on ? tg.MainButton.showProgress(false) : tg.MainButton.hideProgress(); else $("#fallback").disabled = on; }

/* ------------------------------------------------ mahsulot oynasi */
function openProduct(id) {
  const p = prod(id); if (!p) return;
  px("ViewContent", { content_ids: [String(p.id)], content_type: "product", value: p.price, currency: "UZS", content_name: p.name });
  const cat = S.cats.find(c => c.id === p.cat_id);
  const imgs = p.images.length || !(p.video && p.video.src) && !p.youtube ? (p.images.length ? p.images : [null]) : p.images;
  // slaydlar: rasmlar, keyin video (bo'lsa) va YouTube (bo'lsa)
  const slides = imgs.map((src, k) => `<div>${src ? `<img src="${esc(src)}" alt="" onclick="openViewer(${p.id}, ${k})"><span class="zoom-hint">🔍</span>` : esc(p.emoji)}</div>`);
  if (p.video && p.video.src) slides.push(`<div class="vid"><video src="${esc(p.video.src)}" ${p.video.poster ? `poster="${esc(p.video.poster)}"` : ""}
      controls playsinline preload="metadata"></video></div>`);
  if (p.youtube) slides.push(`<div class="vid"><iframe src="https://www.youtube-nocookie.com/embed/${esc(p.youtube)}?playsinline=1&rel=0"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen loading="lazy"></iframe></div>`);
  const hasVid = (p.video && p.video.src) || p.youtube;
  openSheet({
    title: "",
    rerender: () => `
      <div class="gallery" onscroll="galleryScroll(this)">${slides.join("")}</div>
      ${slides.length > 1 ? `<div class="dots">${slides.map((_, k) => `<i class="${k ? "" : "on"}${k >= imgs.length ? " v" : ""}"></i>`).join("")}</div>` : ""}
      ${hasVid && imgs.length ? `<div style="text-align:center;margin-top:8px"><button class="btn soft sm" onclick="toVideo(this)">▶ ${t("watch_video")}</button></div>` : ""}
      <div class="section">
        ${cat ? `<div class="small muted">${esc(cat.emoji)} ${esc(cat.name)}</div>` : ""}
        <h2 style="margin:4px 0 8px;font-size:20px">${esc(p.name)}</h2>
        <div style="font-size:22px" class="price">${money(p.price)}
          ${p.old_price > p.price ? `<span class="old" style="font-size:14px">${money(p.old_price)}</span> <span class="badge" style="position:static">−${discount(p)}%</span>` : ""}</div>
        ${p.delivery_days ? `<div class="ddbox">${t("delivery_time")} <b>${esc(p.delivery_days)}</b></div>` : ""}
        <div class="ddbox free-box">${t("free_deliv")}</div>
        ${p.assembly && S.asmPct ? `<div class="ddbox">${t("asm_avail", { p: S.asmPct })}</div>` : ""}
        ${warrantyOf(p) ? `<div class="ddbox">🛡 ${t("warranty")}: <b>${esc(warrantyOf(p))}</b></div>` : ""}
        ${!p.in_stock ? `<div class="err">${t("oos")}</div>` : ""}
      </div>
      ${p.specs.length ? `<div class="section"><h3>${t("specs")}</h3><table class="specs">
        ${p.specs.map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table></div>` : ""}
      ${p.description ? `<div class="section"><h3>${t("desc")}</h3><div style="white-space:pre-line">${esc(p.description)}</div></div>` : ""}
      ${changeBoxHTML(p)}`,
    main: () => !p.in_stock ? [null] : S.cart[p.id]
      ? [t("in_cart_go", { n: S.cart[p.id] }), () => { closeAll(); go("cart"); }]
      : [t("add_cart", { sum: money(p.price) }), () => { setQty(p.id, 1); notifyH("success"); }],
  });
  // savatchadagi miqdorni oyna ichida o'zgartirish
  if (p.in_stock) {
    const sh = S.sheets[S.sheets.length - 1];

var V = { open: false, srcs: [], name: "", idx: 0, s: 1, x: 0, y: 0 };
function openViewer(pid, idx) {

function showViewer(srcs, idx = 0, name = "isofa") {

  $("#viewer").classList.remove("hidden");

function vCount() {
  const tr = $("#vtrack");
  V.idx = Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth));
  $("#vcount").textContent = V.srcs.length > 1 ? `${V.idx + 1} / ${V.srcs.length}` : "";
}
function vApply(img, anim) {
  img.classList.toggle("drag", !anim);
  img.style.transform = `translate(${V.x}px, ${V.y}px) scale(${V.s})`;
  $("#vtrack").classList.toggle("zoomed", V.s > 1.01);
}
function vClamp(img) {
  const r = img.getBoundingClientRect(), w = r.width / V.s, h = r.height / V.s;
  const mx = Math.max(0, (w * V.s - innerWidth) / 2), my = Math.max(0, (h * V.s - innerHeight) / 2);
  V.x = Math.max(-mx, Math.min(mx, V.x)); V.y = Math.max(-my, Math.min(my, V.y));
}
function bindZoom(slide) {
  const img = slide.querySelector("img"), pts = new Map();
  let startDist = 0, startS = 1, last = null, lastTap = 0;
  const dist = () => { const [a, b] = [...pts.values()]; return Math.hypot(a.x - b.x, a.y - b.y); };
  slide.addEventListener("pointerdown", e => {
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2) { startDist = dist(); startS = V.s; }
    last = { x: e.clientX, y: e.clientY };
    if (pts.size === 2 || V.s > 1.01) slide.setPointerCapture(e.pointerId);
  });
  slide.addEventListener("pointermove", e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pts.size === 2 && startDist) {
      V.s = Math.max(1, Math.min(5, startS * dist() / startDist)); vClamp(img); vApply(img, false);
    } else if (pts.size === 1 && V.s > 1.01 && last) {
      V.x += e.clientX - last.x; V.y += e.clientY - last.y; vClamp(img); vApply(img, false);
    }
    last = { x: e.clientX, y: e.clientY };
  });
  const up = e => {
    pts.delete(e.pointerId);
    if (pts.size < 2) startDist = 0;
    if (V.s <= 1.02) { V.s = 1; V.x = 0; V.y = 0; vApply(img, true); }
    if (e.type === "pointerup" && pts.size === 0) {
      const now = Date.now();
      if (now - lastTap < 300) {            // ikki marta bosish
        if (V.s > 1.01) { V.s = 1; V.x = 0; V.y = 0; } else { V.s = 2.5; }
        vClamp(img); vApply(img, true); lastTap = 0;
      } else lastTap = now;
    }
  };
  slide.addEventListener("pointerup", up);
  slide.addEventListener("pointercancel", up);
}
async function saveImage() {
  const src = V.srcs[V.idx]; if (!src) return;

let leafletReady = null;

const MP = { map: null, kind: "", lat: 41.3111, lon: 69.2797, label: "", timer: 0 };
let ymapsReady = null;
function loadYandex(key) {
  if (window.ymaps && window.ymaps.Map) return Promise.resolve();
  if (ymapsReady) return ymapsReady;
  ymapsReady = new Promise((ok, fail) => {
    const js = document.createElement("script");
    js.src = `https://api-maps.yandex.ru/2.1/?apikey=${encodeURIComponent(key)}&lang=${LANG === "ru" ? "ru_RU" : "uz_UZ"}`;
    const t = setTimeout(() => { ymapsReady = null; fail(new Error("timeout")); }, 12000);
    js.onload = () => window.ymaps.ready(() => { clearTimeout(t); ok(); }, err => { clearTimeout(t); ymapsReady = null; fail(err); });
    js.onerror = () => { clearTimeout(t); ymapsReady = null; fail(new Error("load")); };
    document.head.appendChild(js);
  });
  return ymapsReady;
}
function mpSetView(lat, lon, zoom) {
  if (!MP.map) return;
  if (MP.kind === "y") MP.map.setCenter([lat, lon], zoom, { duration: 300 });
  else MP.map.setView([lat, lon], zoom);

}
function mpMoved() { clearTimeout(MP.timer); MP.timer = setTimeout(reverseGeo, 500); }

        { suppressMapOpenBlock: true, yandexMapDisablePoiInteractivity: true });
      MP.map.events.add("actiontick", e => { const c = MP.map.getCenter(); MP.lat = c[0]; MP.lon = c[1]; });
      MP.map.events.add("boundschange", () => { const c = MP.map.getCenter(); MP.lat = c[0]; MP.lon = c[1]; mpMoved(); });
      if (!has) locateMe(); else reverseGeo();
      return;
    } catch (e) { console.warn("Yandex xarita yuklanmadi, OpenStreetMap ishlatiladi", e); }
  }
  // 2) Zaxira: OpenStreetMap (Leaflet)

      { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(MP.map);
    MP.map.on("move", () => { const c = MP.map.getCenter(); MP.lat = c.lat; MP.lon = c.lng; });
    MP.map.on("moveend", mpMoved);
    if (!has) locateMe(); else reverseGeo();
  }, 280);
}
function locateMe() {
  const go = (lat, lon) => { mpSetView(lat, lon, 17); haptic(); };
  const fallback = () => {
    if (!navigator.geolocation) return toast(t("no_geo"));
    navigator.geolocation.getCurrentPosition(p => go(p.coords.latitude, p.coords.longitude),
      () => toast(t("geo_denied")), { enableHighAccuracy: true, timeout: 12000 });
  };
  try {
    const LM = tg && tg.LocationManager;
    if (IN_TG && LM && tg.isVersionAtLeast && tg.isVersionAtLeast("8.0")) {
      return LM.init(() => {
        if (!LM.isLocationAvailable) return fallback();
        LM.getLocation(d => d ? go(d.latitude, d.longitude) : (LM.isAccessRequested && !LM.isAccessGranted
          ? confirmBox(t("geo_settings")).then(y => y && LM.openSettings())
          : fallback()));
      });
    }
  } catch (e) { /* eski Telegram */ }
  fallback();
}
async function reverseGeo() {
  const lab = document.getElementById("mpLabel"); if (!lab) return;
  const coords = MP.lat.toFixed(5) + ", " + MP.lon.toFixed(5);
  const lat = MP.lat, lon = MP.lon;

    try {
      const r = await fetch(`https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(S.shop.ygeo_key)}&geocode=${lon},${lat}&format=json&results=1&lang=${LANG === "ru" ? "ru_RU" : "uz_UZ"}`);
      const d = await r.json();
      const g = d.response.GeoObjectCollection.featureMember[0];
      if (g) label = g.GeoObject.metaDataProperty.GeocoderMetaData.text || "";
    } catch (e) { /* keyingi usul */ }
  }
  // 2) Yandex JS API geokoderi (xarita kaliti ruxsat bersa)
  if (!label && MP.kind === "y" && window.ymaps) {
    try {
      const res = await ymaps.geocode([lat, lon], { results: 1 });
      const g = res.geoObjects.get(0);
      if (g) label = g.getAddressLine();
    } catch (e) { /* keyingi usul */ }
  }
  // 3) Zaxira: OpenStreetMap (Nominatim)
  if (!label) {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&accept-language=${LANG}&lat=${lat}&lon=${lon}`);
      const d = await r.json(); const a = d.address || {};
      const parts = [a.road, a.house_number, a.neighbourhood || a.suburb, a.city || a.town || a.village || a.county].filter(Boolean);
      label = parts.length ? parts.join(", ") : (d.display_name || "");
    } catch (e) { /* koordinata qoladi */ }
  }
  if (lat !== MP.lat || lon !== MP.lon) return;  // bu orada xarita surilgan — eski javobni ko'rsatmaymiz
  MP.label = (label || coords).replace(/^(O[ʻ'`‘]?zbekiston|Узбекистан|Uzbekistan),\s*/i, "");
  lab.textContent = MP.label;
}
/* --- manzilni yozib qidirish --- */
let mpSearchTimer = 0, mpSearchSeq = 0;
function mpSearchSoon(q) { clearTimeout(mpSearchTimer); mpSearchTimer = setTimeout(() => mpSearch(q), 450); }
async function mpSearch(q) {
  q = (q || "").trim();
  const box = document.getElementById("mpRes"); if (!box) return;
  if (q.length < 3) { box.classList.add("hidden"); return; }
  const seq = ++mpSearchSeq;
  box.innerHTML = `<div class="mpitem muted">⏳ ${t("searching")}</div>`; box.classList.remove("hidden");
  let items = [];
  if (S.shop.ygeo_key) {  // Yandex geokoder — O'zbekiston bo'yicha
    try {
      const r = await fetch(`https://geocode-maps.yandex.ru/1.x/?apikey=${encodeURIComponent(S.shop.ygeo_key)}&format=json&results=7`
        + `&lang=${LANG === "ru" ? "ru_RU" : "uz_UZ"}&bbox=55.9,37.1~73.2,45.6&rspn=1&geocode=${encodeURIComponent(q)}`);
      const d = await r.json();
      items = d.response.GeoObjectCollection.featureMember.map(m => {
        const g = m.GeoObject, [lon, lat] = g.Point.pos.split(" ").map(Number);
        return { name: g.name, desc: g.description || "", lat, lon };
      });
    } catch (e) { /* zaxira */ }
  }
  if (!items.length) {  // zaxira: OpenStreetMap
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/search?format=jsonv2&countrycodes=uz&limit=7&accept-language=${LANG}&q=${encodeURIComponent(q)}`);
      items = (await r.json()).map(x => { const parts = x.display_name.split(", ");
        return { name: parts.slice(0, 2).join(", "), desc: parts.slice(2, 5).join(", "), lat: +x.lat, lon: +x.lon }; });
    } catch (e) { /* bo'sh */ }
  }
  if (seq !== mpSearchSeq) return;  // eskirgan javob
  window._mpItems = items;
  box.innerHTML = items.length
    ? items.map((it, i) => `<div class="mpitem" onclick="mpPick(${i})"><b>${esc(it.name)}</b>${it.desc ? `<div class="small muted">${esc(it.desc.replace(/^(O[ʻ'`‘]?zbekiston|Узбекистан|Uzbekistan),?\s*|,?\s*(O[ʻ'`‘]?zbekiston|Узбекистан|Uzbekistan)$/gi, ""))}</div>` : ""}</div>`).join("")
    : `<div class="mpitem muted">${t("nothing")}</div>`;
}
function mpPick(i) {
  const it = (window._mpItems || [])[i]; if (!it) return;
  document.getElementById("mpRes").classList.add("hidden");
  const inp = document.getElementById("mpQ"); if (inp) { inp.value = it.name; inp.blur(); }
  MP.label = [it.name, it.desc].filter(Boolean).join(", ");
  const lab = document.getElementById("mpLabel"); if (lab) lab.textContent = MP.label;
  mpSetView(it.lat, it.lon, 17); haptic();
}

function pickPlace() {
  F.lat = MP.lat; F.lon = MP.lon; F.geo = MP.label || (MP.lat.toFixed(5) + ", " + MP.lon.toFixed(5)); F.prevGeo = false; F.err = "";

let sending = false;
async function submitOrder() {
  if (sending) return;
  const digits = (F.phone || "").replace(/\D/g, "");
  F.err = F.name.trim().length < 2 ? t("e_name")
    : digits.length < 9 ? t("e_phone")
    : F.delivery === "delivery" && F.lat == null ? t("e_addr")
    : !(S.prepay && S.prepay.card) ? t("e_card")
    : F.receiptBusy ? t("e_rc_busy")
    : !F.receipt ? t("e_rc", { sum: money(prepayOf(coTotal())) })
    : asmAsk() && !asmAnswered() ? t("e_asm")
    : !F.offer ? t("e_offer") : "";
  if (F.err) { notifyH("error"); refresh(); const e = document.querySelector(".sheet.on .err:last-of-type"); e && e.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
  sending = true; mainBusy(true);
  try {
    // saytdan (Telegram'siz) buyurtma: xaridorga maxfiy kalit — keyin «Buyurtmalarim»da o'z buyurtmalarini ko'radi
    if (!IN_TG && !store.get("wtok", "")) store.set("wtok", (await api("/api/web/session", { method: "POST" })).token);
    const fd = new FormData();
    fd.append("data", JSON.stringify({
      items: cartItems().map(({ p, qty }) => ({ id: p.id, qty })),
      // shaharga xaritadan aniqlangan manzil nomini ham qo'shamiz (admin ko'rishi uchun)
      customer: { name: F.name, phone: F.phone, delivery: F.delivery,
                  city: F.delivery === "delivery" && F.geo && !F.prevGeo ? `${F.city} — ${F.geo}` : F.city, address: F.address,
                  lat: F.lat, lon: F.lon, pay: F.pay, note: F.note,
                  assembly: asmAsk() && asmChosen().length > 0, assembly_ids: asmAsk() ? asmChosen().map(x => x.p.id) : [] },
      offer: F.offer, offer_ver: S.offerVer }));
    fd.append("receipt", F.receipt, "chek.jpg");
    const { order } = await api("/api/order", { form: fd });
    notifyH("success");
    px("Purchase", { content_ids: (order.items || []).map(i => String(i.id)), content_type: "product", value: order.total, currency: "UZS" });
    S.cart = {}; store.set("cart", {});
    closeAll(); loadMe().then(render);
    go("orders");
    openSheet({ title: "", body: `<div class="done"><div class="big">📨</div><h2>${t("sent_title")}</h2>
      <p class="muted">${t("order_no")}: <b>№ ${order.id}</b><br>${t("total")}: <b>${money(order.total)}</b><br>${t("prepaid")}: <b>${money(order.prepay)}</b></p>
      <p class="muted small">${t(IN_TG ? "sent_wait" : "sent_wait_web")}</p></div>`,
      main: () => [t("ok"), closeAll] });
  } catch (e) {
    F.err = e.message; notifyH("error");
    if (/sotuvda|omborda|karta|продаж|наличии|карт/i.test(e.message)) loadCatalog().then(refresh); else refresh();
  } finally { sending = false; mainBusy(false); }
}

function initPixel(id) {

    !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments) };
      if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v;
      s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s) }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
    fbq("init", String(id)); fbq("track", "PageView");

}

const MAX_IMGS = 10;
function setVideo(f) {
  if (!f) return;
  if (f.size > 400e6) return alertBox("Video juda katta (400 MB dan oshmasin). Qisqaroq video tanlang.");
  if (PF.videoUrl) URL.revokeObjectURL(PF.videoUrl);

// katta fayl yuklashda foizni ko'rsatish uchun XHR
function uploadForm(path, fd, onProgress) {
  return new Promise((ok, fail) => {
    const x = new XMLHttpRequest(); x.open("POST", path);
    x.setRequestHeader("X-Init-Data", (tg && tg.initData) || ""); x.setRequestHeader("X-Lang", LANG);
    x.upload.onprogress = e => e.lengthComputable && onProgress(Math.round(e.loaded / e.total * 100));
    x.onload = () => { let d = {}; try { d = JSON.parse(x.responseText); } catch (e) {}
      x.status < 300 ? ok(d) : fail(new Error(d.error || "Xatolik yuz berdi")); };
    x.onerror = () => fail(new Error("Internet aloqasini tekshiring"));
    x.send(fd);
  });
}
function mainImg(i) { const [im] = PF.imgs.splice(i, 1); PF.imgs.unshift(im); haptic(); refresh(); }
function removeImg(i) { const [im] = PF.imgs.splice(i, 1); if (im.kind === "n") URL.revokeObjectURL(im.src); refresh(); }
// Telefondagi katta rasmni yuklashdan oldin kichraytiramiz (tezroq yuklanadi, internet tejaladi)
async function shrink(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file, { imageOrientation: "from-image" });
    const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
    if (k === 1 && file.size < 1.5e6) return file;
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise(r => c.toBlob(r, "image/jpeg", 0.86));
    return blob ? new File([blob], "photo.jpg", { type: "image/jpeg" }) : file;
  } catch (e) { return file; }
}
async function addFiles(list) {
  const files = [...list].filter(f => f.type.startsWith("image/") || /\.(jpe?g|png|heic|webp)$/i.test(f.name));
  const room = MAX_IMGS - PF.imgs.length;
  if (files.length > room) toast(`Faqat ${room} ta rasm qo'shildi (ko'pi bilan ${MAX_IMGS} ta)`);
  const take = files.slice(0, room);
  PF.loading = take.length; refresh();
  for (const f of take) {
    const small = await shrink(f);
    PF.imgs.push({ kind: "n", file: small, src: URL.createObjectURL(small) });
    PF.loading--; refresh();
  }
}
async function saveProduct() {
  PF.err = !PF.name.trim() ? "Nomini kiriting" : !String(PF.price).replace(/\D/g, "") ? "Narxini kiriting"
    : PF.sup_new && !PF.sup_name.trim() ? "Yangi ta'minotchi nomini kiriting" : "";
  if (PF.err) return refresh();
  if (PF.loading) { PF.err = "Rasmlar tayyorlanmoqda, biroz kuting"; return refresh(); }
  PF.busy = true; refresh();
  const fd = new FormData();
  const fields = { id: PF.id, name: PF.name, cat_id: PF.cat_id || "", price: PF.price, old_price: PF.old_price, emoji: PF.emoji,
    description: PF.description, specs: PF.specs, in_stock: PF.in_stock ? 1 : 0, active: PF.active ? 1 : 0,
    delivery_days: PF.delivery_days, youtube: PF.youtube, video_action: PF.videoAction,
    supplier_id: PF.sup_new ? "" : PF.supplier_id, supplier_sku: PF.supplier_sku, cost: PF.cost, assembly: PF.assembly ? 1 : 0 };
  if (PF.sup_new) Object.assign(fields, { supplier_new_name: PF.sup_name, supplier_new_phone: PF.sup_phone, supplier_new_note: PF.sup_note });
  if (PF.ru_edited) Object.assign(fields, { ru_edited: 1, name_ru: PF.name_ru, description_ru: PF.description_ru,
    specs_ru: PF.specs_ru, delivery_days_ru: PF.delivery_days_ru });
  let n = 0;
  const order = PF.imgs.map(im => im.kind === "k" ? "k:" + im.src : "n:" + (n++));
  fields.keep_images = JSON.stringify(PF.imgs.filter(im => im.kind === "k").map(im => im.src));
  fields.order = JSON.stringify(order);
  Object.entries(fields).forEach(([k, v]) => fd.append(k, v ?? ""));
  PF.imgs.filter(im => im.kind === "n").forEach(im => fd.append("images", im.file, im.file.name || "photo.jpg"));
  if (PF.videoFile) fd.append("video", PF.videoFile, PF.videoFile.name || "video.mp4");
  try {
    if (PF.videoFile) {
      let last = -1;
      await uploadForm("/api/admin/product", fd, pct => { PF.progress = pct; if (pct - last >= 2) { last = pct; refresh(); } });
      toast("Saqlandi ✓ Video 1–3 daqiqada tayyor bo'ladi");
    } else { await api("/api/admin/product", { form: fd }); toast("Saqlandi ✓"); }
    notifyH("success");
        closeAll(); await Promise.all([loadAdmin(), loadCatalog()]); render(); }
  catch (e) { PF.err = e.message; PF.busy = false; refresh(); }
}

async function setLang(l, save = true) {
  l = normLang(l);

  if (changed) {
    try { await Promise.all([loadCatalog(), loadMe()]); } catch (e) { toast(e.message); }

}

})();
