<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mebelix - Mebel Do'koni</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 16px;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    .card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .btn {
      background-color: var(--tg-theme-button-color, #2481cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      width: 100%;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h2>Mebelix Katalogi</h2>
  
  <div class="card">
    <h3>Burchak Oshxona Mebeli</h3>
    <p>Narxi: 12,000,000 so'm</p>
    <button class="btn" onclick="orderItem('Burchak Oshxona Mebeli', 12000000)">Buyurtma berish</button>
  </div>

  <div class="card">
    <h3>Yotoqxona Shkafi</h3>
    <p>Narxi: 6,500,000 so'm</p>
    <button class="btn" onclick="orderItem('Yotoqxona Shkafi', 6500000)">Buyurtma berish</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Oynani to'liq ekranga yozish

    async function orderItem(name, price) {
      const user = tg.initDataUnsafe?.user;
      
      const payload = {
        customerName: user ? `${user.first_name} ${user.last_name || ''}` : 'Test Mijoz',
        phone: user?.username ? `@${user.username}` : 'Ko\'rsatilmagan',
        cartItems: [
          { name: name, quantity: 1, price: price }
        ],
        totalPrice: price
      };

      tg.MainButton.setText("Yuborilmoqda...").show();

      try {
        const response = await fetch('/api/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.success) {
          tg.showAlert("Buyurtmangiz qabul qilindi! Admin tez orada bog'lanadi.");
          tg.close(); // WebApp oynasini yopish
        } else {
          tg.showAlert("Xatolik: " + result.message);
        }
      } catch (err) {
        console.error(err);
        tg.showAlert("Server bilan ulanishda xatolik yuz berdi!");
      } finally {
        tg.MainButton.hide();
      }
    }
  </script>
</body>
</html>
