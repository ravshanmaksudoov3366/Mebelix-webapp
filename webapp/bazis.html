<style>
:root{--bg2:#f6f2ea;--text:#1f1e1f;--hint:#6f695f;--line:#e6dfd2;--soft:#f3e8cd;--gold:#e9cc85;--char:#363435;--ok:#2f7d4f;--bad:#b3412e;--serif:"Cormorant Garamond",Georgia,serif;--r:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg2);color:var(--text);font-family:"Montserrat",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:14px}
button,input,select{font-family:inherit;font-size:inherit;color:var(--text)}
header{background:var(--char);padding:calc(10px + var(--tg-safe-area-inset-top,0px) + var(--tg-content-safe-area-inset-top,0px)) 14px 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;flex-direction:column;color:var(--gold);font-size:21px;font-weight:600;line-height:1}
.brand small{font-size:8px;letter-spacing:1.6px;color:#cdb57a;margin-top:3px;font-weight:500}
.back{border:1px solid #5a5758;color:var(--gold);border-radius:12px;padding:7px 10px;font-size:12.5px;font-weight:600;text-decoration:none}
.hact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:0;border-radius:11px;padding:9px 13px;font-weight:600;font-size:13px;cursor:pointer;background:var(--char);color:var(--gold);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn.l{background:#fff;color:var(--text);border:1.5px solid var(--line)}
.btn.g{background:var(--gold);color:var(--char)}
.btn.s{padding:6px 9px;font-size:12px;border-radius:9px}
.btn.x{background:#fff;color:var(--bad);border:1.5px solid #ecd2cc}
header .btn.l{background:transparent;color:#f6f2ea;border-color:#5a5758}
nav{display:flex;gap:6px;padding:10px 14px 0;overflow-x:auto;max-width:1800px;margin:0 auto}
nav button{border:1.5px solid var(--line);background:#fff;border-radius:20px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--char);color:var(--gold);border-color:var(--char)}
main{max-width:1800px;margin:0 auto;padding:12px 14px calc(40px + var(--tg-safe-area-inset-bottom,0px))}
.card{background:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px}
.card h2{margin:0 0 10px;font-family:var(--serif);font-size:22px;font-weight:600;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card h2 small{font-family:Montserrat,sans-serif;font-size:12px;color:var(--hint);font-weight:500}
.grid{display:grid;grid-template-columns:minmax(330px,440px) 1fr;gap:12px;align-items:start}
.grid>div:last-child{position:sticky;top:76px}
@media(max-width:900px){.grid{grid-template-columns:1fr}.grid>div:last-child{position:static}}
.f{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.f4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
label.l{display:flex;flex-direction:column;gap:3px;font-size:11.5px;color:var(--hint);font-weight:600}
.in{border:1.5px solid var(--line);border-radius:9px;padding:7px 8px;background:#fff;width:100%;min-width:0}
.in:focus{outline:none;border-color:#c9a85c}
input[type=color].in{height:36px;padding:3px;cursor:pointer}
.seg{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:#fff;padding:7px 6px;font-weight:600;cursor:pointer;font-size:12.5px}
.seg button.on{background:var(--char);color:var(--gold)}
.adds{display:flex;flex-wrap:wrap;gap:6px}
.mod{border:1.5px solid var(--line);border-radius:12px;padding:9px;margin-top:8px}
.chk{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;font-size:12.5px;cursor:pointer;background:#fff}
.chk input[type=checkbox]{width:16px;height:16px;accent-color:#363435}
.v3d{position:absolute;right:10px;top:10px;z-index:2;display:flex;gap:6px}
.mod.sel{border-color:#c9a85c;background:#fffcf3}
.mh{display:flex;align-items:center;gap:6px;cursor:pointer}
.mh b{flex:1;font-size:13px}
.mh .dim{color:var(--hint);font-size:12px}
.mb{margin-top:8px}
#view{width:100%;height:max(520px,calc(100vh - 330px));border-radius:12px;background:#ebe5da;position:relative;overflow:hidden;touch-action:none}
@media(max-width:900px){#view{height:340px}}
#view .msg{position:absolute;inset:0;display:grid;place-items:center;color:var(--hint);text-align:center;padding:20px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--hint);margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:6px 7px;border-bottom:1px solid #efe9de;text-align:left;vertical-align:top}
th{font-size:11px;color:var(--hint);font-weight:600;background:#faf7f1;position:sticky;top:0}
td.n,th.n{text-align:right;white-space:nowrap}
tr.grp td{background:var(--soft);font-weight:700}
.tw{overflow-x:auto}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
@media(max-width:700px){.kp{grid-template-columns:repeat(2,1fr)}}
.kp div{background:#fff;border-radius:14px;padding:12px}
.kp span{font-size:11.5px;color:var(--hint);font-weight:600}
.kp b{display:block;font-size:19px;margin-top:4px}
.sheets{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,560px),1fr));gap:14px}
.sheet{margin:6px 0 4px}
.sheet svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px;display:block;margin-top:4px}
.note{font-size:12px;color:var(--hint);line-height:1.45}
.warn{background:#fff6e5;border:1px solid #f0d9a8;border-radius:10px;padding:9px 11px;font-size:12.5px;margin-bottom:10px}
.tot td{font-weight:700}
.big td{font-size:15px;font-weight:700;background:var(--soft)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.prow{display:flex;align-items:center;gap:8px;border-bottom:1px solid #f1ebe0;padding:5px 0}
.prow span{flex:1;font-size:12.5px}
.prow input{width:120px;text-align:right}
.edge{font-family:ui-monospace,Menlo,monospace;font-size:11.5px;white-space:nowrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:14px}
.modal>div{background:#fff;border-radius:16px;padding:16px;max-width:560px;width:100%;max-height:85vh;overflow:auto}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--char);color:var(--gold);padding:10px 16px;border-radius:12px;font-weight:600;z-index:30}
.gate{max-width:520px;margin:60px auto;background:#fff;border-radius:16px;padding:22px;text-align:center;line-height:1.5}
#print{display:none}
@media print{
  header,nav,main,.toast,.modal{display:none!important}
  #print{display:block;font-size:11px}
  #print h1{font-family:var(--serif);font-size:22px;margin:0 0 4px}
  #print h2{font-size:14px;margin:16px 0 6px;page-break-after:avoid}
  #print table{font-size:10px}
  #print .sheet{page-break-inside:avoid}
  #print th{position:static}
}

<script>
/* ======================== ENGINE (DOMsiz — testlanadi) ======================== */
const T = 16;            // korpus qalinligi (LDSP 16)
const HDF = 3;           // orqa devor / tortma tagi (DVP)
/* row: floor | wall. top: stoleshnitsa ostida. carcass: korpusi bor. legs: nojka */
const TYPES = {
  base:      {uz:"Pastki shkaf",          row:"floor", top:1, carcass:1, legs:1, w:600, h:720, d:560, doors:2, shelves:1, drawers:0, open:"hinged"},
  sink:      {uz:"Moyka osti",            row:"floor", top:1, carcass:1, legs:1, w:800, h:720, d:560, doors:2, shelves:0, drawers:0, open:"hinged", extras:["sink","mixer"]},
  drawer:    {uz:"Tortmali shkaf",        row:"floor", top:1, carcass:1, legs:1, w:600, h:720, d:560, doors:0, shelves:0, drawers:3, open:"none"},
  oven:      {uz:"Duxovka shkafi",        row:"floor", top:1, carcass:1, legs:1, w:600, h:720, d:560, doors:0, shelves:0, drawers:1, open:"none", extras:["oven","hob"]},
  dishwasher:{uz:"Idish yuvish mashinasi",row:"floor", top:1, carcass:0, legs:0, w:600, h:720, d:560, doors:1, shelves:0, drawers:0, open:"flap", extras:["dishwasher"]},
  stove:     {uz:"Gaz plita (alohida)",   row:"floor", top:0, carcass:0, legs:0, w:600, h:850, d:600, doors:0, shelves:0, drawers:0, open:"none", extras:["stove"]},
  fridge:    {uz:"Muzlatgich joyi",       row:"floor", top:0, carcass:0, legs:0, w:600, h:1850,d:650, doors:0, shelves:0, drawers:0, open:"none", extras:["fridge"]},
  wall:      {uz:"Yuqori shkaf",          row:"wall",  top:0, carcass:1, legs:0, w:600, h:720, d:300, doors:2, shelves:2, drawers:0, open:"hinged"},
  hood:      {uz:"Vytyajka shkafi",       row:"wall",  top:0, carcass:1, legs:0, w:600, h:360, d:300, doors:1, shelves:0, drawers:0, open:"lift", extras:["hood"], alignTop:1},
  tall:      {uz:"Pena (baland shkaf)",   row:"floor", top:0, carcass:1, legs:1, w:600, h:2100,d:560, doors:2, shelves:4, drawers:0, open:"hinged"},
  wardrobe:  {uz:"Shkaf / garderob",      row:"floor", top:0, carcass:1, legs:0, w:1200,h:2400,d:600, doors:2, shelves:3, drawers:0, open:"hinged", rod:1},
  tv:        {uz:"TV tumba",              row:"floor", top:0, carcass:1, legs:1, w:1600,h:450, d:400, doors:2, shelves:0, drawers:2, open:"hinged"},
  komod:     {uz:"Komod / tumba",         row:"floor", top:0, carcass:1, legs:1, w:800, h:850, d:450, doors:0, shelves:0, drawers:4, open:"none"},
  shelf:     {uz:"Ochiq stellaj",         row:"floor", top:0, carcass:1, legs:0, w:800, h:1800,d:300, doors:0, shelves:4, drawers:0, open:"none"},
};
const OPEN = {hinged:"Ochiladigan eshik", lift:"Yuqoriga ko'tariladigan (lift)", kupe:"Kupe (suriladigan)", flap:"Pastga ochiladigan", none:"Eshiksiz"};
/* Qo'shimchalar va texnika: t — qaysi modullarda, p — narx kaliti, m — metr bo'yicha (eniga qarab) */
const EXTRAS = {
  sink:      {uz:"Moyka (rakovina)",            t:["sink","base"],                 p:"x_sink"},
  mixer:     {uz:"Smesitel (kran)",             t:["sink","base"],                 p:"x_mixer"},
  trash:     {uz:"Musor chelagi (ichki)",       t:["sink","base"],                 p:"x_trash"},
  cargo:     {uz:"Butilochnitsa (cargo)",       t:["base","drawer"],               p:"x_cargo"},
  hob:       {uz:"Gaz panel (varochnaya)",      t:["base","oven","drawer"],        p:"x_hob"},
  oven:      {uz:"Duxovka (o'rnatma)",          t:["oven","tall"],                 p:"x_oven"},
  micro:     {uz:"Mikroto'lqinli pech",         t:["tall","wall"],                 p:"x_micro"},
  dishwasher:{uz:"Idish yuvish mashinasi",      t:["dishwasher"],                  p:"x_dw"},
  stove:     {uz:"Gaz plita",                   t:["stove"],                       p:"x_stove"},
  fridge:    {uz:"Muzlatgich",                  t:["fridge"],                      p:"x_fridge"},
  dryer:     {uz:"Sushka (idish quritgich)",    t:["wall"],                        p:"x_dryer"},
  hood:      {uz:"Vytyajka",                    t:["hood","wall"],                 p:"x_hood"},
  led:       {uz:"LED yoritgich (shkaf ostiga)",t:["wall","hood"],                 p:"x_led", m:1},
  rail:      {uz:"Reling (osma tayoq)",         t:["wall","hood","base","sink"],   p:"x_rail", m:1},
};
const PRICE_DEF = [
  // [kalit, nom, birlik, narx so'm] — TAXMINIY, egasi o'zinikini kiritadi
  ["ldsp",       "LDSP 16 mm (korpus) — list",        "list", 650000],
  ["ldsp_f",     "LDSP 16 mm (fasad uchun) — list",   "list", 650000],
  ["hdf",        "DVP / HDF 3 mm — list",             "list", 130000],
  ["mdf",        "MDF fasad (plyonka/bo'yalgan) — m²","m²",   480000],
  ["akril",      "Akril / AGT fasad — m²",            "m²",   750000],
  ["glass_door", "Oynali fasad (ramka + oyna) — m²",  "m²",   900000],
  ["edge2",      "Kromka 2 mm — metr",                "m",    6000],
  ["edge04",     "Kromka 0.4 mm — metr",              "m",    2000],
  ["worktop",    "Stoleshnitsa — pog. metr",          "m",    450000],
  ["plinth",     "Tsokol (plintus) — pog. metr",      "m",    60000],
  ["hinge_gtv",  "Petlya GTV (dovodchikli)",          "dona", 25000],
  ["hinge_blum", "Petlya Blum Clip top Blumotion",    "dona", 85000],
  ["slide_gtv",  "Napravlyayushchiy GTV (sharikli, dovodchik) — juft","juft", 95000],
  ["slide_blum", "Blum Tandembox (to'plam)",          "to'plam", 750000],
  ["lift_gtv",   "Lift mexanizm GTV",                 "dona", 150000],
  ["lift_blum",  "Blum Aventos HF/HK",                "dona", 950000],
  ["flap",       "Pastga ochiladigan fasad mexanizmi","dona", 60000],
  ["kupe",       "Kupe tizimi (bitta eshikka)",       "eshik",420000],
  ["handle",     "Ruchka",                            "dona", 30000],
  ["leg",        "Nojka (oyoq)",                      "dona", 8000],
  ["hanger",     "Osma (navesh) yuqori shkafga",      "dona", 9000],
  ["support",    "Polka ushlagich",                   "dona", 500],
  ["confirmat",  "Konfirmat / mahkamlagich",          "dona", 350],
  ["rod",        "Shtanga (kiyim osgich) — metr",     "m",    40000],
  ["x_sink",     "Moyka (rakovina)",                  "dona", 900000],
  ["x_mixer",    "Smesitel (kran)",                   "dona", 450000],
  ["x_trash",    "Musor chelagi (ichki)",             "dona", 250000],
  ["x_cargo",    "Butilochnitsa (cargo)",             "dona", 900000],
  ["x_dryer",    "Sushka (idish quritgich)",          "dona", 350000],
  ["x_led",      "LED yoritgich — metr",              "m",    120000],
  ["x_rail",     "Reling — metr",                     "m",    90000],
  ["x_hob",      "Gaz panel — agar biz olsak (0 = mijozniki)",   "dona", 0],
  ["x_oven",     "Duxovka — agar biz olsak (0 = mijozniki)",     "dona", 0],
  ["x_micro",    "Mikroto'lqinli pech — agar biz olsak",         "dona", 0],
  ["x_dw",       "Idish yuvish mashinasi — agar biz olsak",      "dona", 0],
  ["x_stove",    "Gaz plita — agar biz olsak",                   "dona", 0],
  ["x_fridge",   "Muzlatgich — agar biz olsak",                  "dona", 0],
  ["x_hood",     "Vytyajka — agar biz olsak",                    "dona", 0],
  ["cut",        "Raskroy xizmati — list",            "list", 35000],
  ["edging",     "Kromkalash xizmati — metr",         "m",    3500],
];
const PRICE_DEFAULTS = Object.fromEntries(PRICE_DEF.map(p=>[p[0],p[3]]));
const DEFAULT_SETTINGS = {furn:"gtv", facade:"mdf", bodyColor:"#efe9df", facadeColor:"#d9cbb3", topColor:"#5b5450",
  plinth:100, wallBottom:1450, worktop:true, sheetL:2800, sheetW:2070, kerf:4, trim:10, grain:false,
  labor:15, markup:30, delivery:0};

function clampInt(v, lo, hi, dflt){ v = Math.round(+v); return isFinite(v) ? Math.min(hi, Math.max(lo, v)) : dflt; }
function newModule(type, id){ const t = TYPES[type]; return {id, type, name:t.uz, w:t.w, h:t.h, d:t.d, doors:t.doors,
  shelves:t.shelves, drawers:t.drawers, open:t.open, rod:t.rod||0, glass:0, extras:(t.extras||[]).slice()}; }
function hingesFor(h){ return h <= 900 ? 2 : h <= 1600 ? 3 : h <= 2000 ? 4 : 5; }
function extrasFor(type){ return Object.keys(EXTRAS).filter(k=>EXTRAS[k].t.includes(type)); }

/* Bitta modul: detallar (L — tola bo'yicha), furnitura, qo'shimchalar va 3D qutilar
   (mm, modulning chap-orqa-pastki burchagidan). Fasad qutilarida «a» — ochilish turi (3D animatsiya uchun). */
function buildModule(m, S){
  const t = TYPES[m.type], W=m.w, H=m.h, D=m.d, parts=[], hw={}, boxes=[], ex={};
  const X = new Set((m.extras||[]).filter(k=>EXTRAS[k] && EXTRAS[k].t.includes(m.type)));
  const add = (name, mat, L, Wd, qty, edge, box) => { if (L>0 && Wd>0 && qty>0) parts.push({mod:m.id, modName:m.name, name, mat, L:Math.round(L), W:Math.round(Wd), qty, edge:edge||[0,0,0,0]}); if (box) boxes.push(...[].concat(box)); };
  const inc = (k, n) => { if (n>0) hw[k] = (hw[k]||0) + n; };
  const inner = W - 2*T;
  const isWall = t.row === "wall";
  const fT = S.facade==="ldsp" ? 16 : 18;
  const fEdge = S.facade==="ldsp" ? [2,2,2,2] : [0,0,0,0];
  const glass = !!m.glass;
  const doorMat = glass ? "glass" : "facade", doorEdge = glass ? [0,0,0,0] : fEdge, doorC = glass ? "glassdoor" : "facade";
  // korpus
  if (t.carcass) {
    add("Yon devor", "body", H, D, 2, [2,0,isWall?1:0,0], [{x:0,y:0,z:0,w:T,h:H,d:D,c:"body"},{x:W-T,y:0,z:0,w:T,h:H,d:D,c:"body"}]);
    add("Tub (pastki)", "body", inner, D, 1, [2,0,0,0], {x:T,y:0,z:0,w:inner,h:T,d:D,c:"body"});
    if (t.top) add("Planka (ustki)", "body", inner, 100, 2, [1,0,0,0], [{x:T,y:H-T,z:D-100,w:inner,h:T,d:100,c:"body"},{x:T,y:H-T,z:0,w:inner,h:T,d:100,c:"body"}]);
    else add("Tom (ustki)", "body", inner, D, 1, [2,0,0,0], {x:T,y:H-T,z:0,w:inner,h:T,d:D,c:"body"});
    add("Orqa devor (DVP)", "hdf", H-4, W-4, 1, null, {x:2,y:2,z:-HDF,w:W-4,h:H-4,d:HDF,c:"back"});
    inc("confirmat", 8);
  }
  // polkalar
  const sh = t.carcass ? clampInt(m.shelves,0,12,0) : 0;
  if (sh) {
    const bx = []; for (let i=1;i<=sh;i++) bx.push({x:T,y:Math.round(H*i/(sh+1)),z:0,w:inner,h:T,d:D-20,c:"body"});
    add("Polka", "body", inner-2, D-20, sh, [2,0,0,0], bx); inc("support", 4*sh);
  }
  if (m.rod && t.carcass) { inc("rod", m.rod*(inner/1000)); boxes.push({x:T,y:H-300,z:D/2-12,w:inner,h:25,d:25,c:"metal"}); }
  // duxovka shkafi: tepada duxovka nishasi (600), pastda tortma
  const ovenNiche = m.type==="oven" && X.has("oven") ? Math.min(600, H-100) : 0;
  if (ovenNiche) {
    add("Polka (duxovka ostida)", "body", inner, D, 1, [2,0,0,0], {x:T,y:H-ovenNiche-T,z:0,w:inner,h:T,d:D,c:"body"});
    boxes.push({x:T+2,y:H-ovenNiche+2,z:D-560,w:inner-4,h:ovenNiche-6,d:560,c:"appl"},
               {x:T+2,y:H-ovenNiche+2,z:D,w:inner-4,h:ovenNiche-6,d:4,c:"ovendoor",a:{k:"flap",key:"oven"}});
  }
  // tortmalar
  const dr = t.carcass ? clampInt(m.drawers,0,8,0) : 0;
  let drawerZoneH = 0;
  if (dr) {
    const hasDoors = m.doors>0 && m.open!=="none";
    drawerZoneH = ovenNiche ? H-ovenNiche-T : !hasDoors ? H : Math.round(H*(m.type==="tv" ? 0.5 : 0.35));
    const bottomZone = !!ovenNiche;
    const fh = (drawerZoneH - 3 - 3*(dr-1)) / dr;
    const slideL = Math.min(550, Math.max(250, Math.floor((D-40)/50)*50));
    const boxH = Math.max(60, Math.min(200, Math.floor((fh-50)/10)*10));
    const fronts = [];
    for (let i=0;i<dr;i++) {
      const y = (bottomZone ? 0 : H - drawerZoneH) + 1.5 + i*(fh+3), key = "dr"+i;

      boxes.push({x:T+13,y:y+20,z:D-slideL-2,w:inner-26,h:boxH,d:slideL,c:"drawer",a:{k:"slide",key,dist:slideL*0.85}});
    }
    add("Tortma fasadi", "facade", W-3, fh, dr, fEdge, fronts);
    if (S.furn==="blum") {
      add("Tortma orqasi (Tandembox)", "body", inner-87, boxH-20, dr, [1,0,0,0]);
      add("Tortma tagi (Tandembox)", "body", inner-75, slideL-24, dr, [0,0,0,0]);

    } else {
      add("Tortma yon devori", "body", slideL, boxH, 2*dr, [1,0,0,0]);

    }

  }
  // eshiklar
  const n = clampInt(m.doors,0,6,0);
  if (m.type === "dishwasher") {
    add("Fasad (idish yuvish mashinasi)", "facade", W-3, H-3, 1, fEdge, {x:1.5,y:1.5,z:D,w:W-3,h:H-3,d:fT,c:"facade",handle:2,a:{k:"flap",key:"dw"}});
    inc("handle", 1);
  } else if (n && m.open!=="none" && t.carcass) {
    const doorZoneH = H - (ovenNiche ? H : drawerZoneH) - (dr ? 3 : 0);
    if (doorZoneH > 50) {
      if (m.open === "kupe") {
        const dw = (W + 30*(n-1)) / n, dh = H - 40;
        const fr = []; for (let i=0;i<n;i++) fr.push({x:i*(dw-30),y:20,z:D+(i%2?28:0),w:dw,h:dh,d:fT,c:doorC,a:{k:"kupe",key:"k"+i,dist:(i < n/2 ? 1 : -1)*(dw-60)}});
        add(glass?"Kupe eshik (oynali)":"Kupe eshik (to'ldirma)", doorMat, dh, dw, n, doorEdge, fr);
        inc("kupe", n);
      } else if (m.open === "lift" || m.open === "flap") {
        const k = m.open==="lift" ? "lift" : "flap";
        add(glass?"Fasad (oynali)":"Fasad ("+(k==="lift"?"lift":"pastga ochiladi")+")", doorMat, W-3, doorZoneH-3, 1, doorEdge,
            {x:1.5,y:1.5,z:D,w:W-3,h:doorZoneH-3,d:fT,c:doorC,handle:k==="lift"?3:2,a:{k,key:"f0"}});
        inc(k==="lift" ? (S.furn==="blum"?"lift_blum":"lift_gtv") : "flap", 1); inc("handle", 1);
      } else {
        const dw = (W - 3 - 3*(n-1)) / n, dh = doorZoneH - 3;
        const fr = []; for (let i=0;i<n;i++) fr.push({x:1.5+i*(dw+3),y:1.5,z:D,w:dw,h:dh,d:fT,c:doorC,handle:isWall?3:1,
          a:{k:"hinge",key:"d"+i,side:(n===1 ? (m.hinge==="R"?"R":"L") : (i < n/2 ? "L" : "R"))}});
        add(glass?"Eshik (oynali)":"Eshik", doorMat, dh, dw, n, doorEdge, fr);
        inc(S.furn==="blum"?"hinge_blum":"hinge_gtv", n*hingesFor(dh)); inc("handle", n);
      }
    }
  }
  if (isWall && t.carcass) inc("hanger", 2);
  else if (t.legs) inc("leg", W>800 ? 6 : 4);
  // qo'shimchalar va texnika
  for (const k of X) {
    const e = EXTRAS[k];
    ex[k] = (ex[k]||0) + (e.m ? W/1000 : 1);
    if (k==="sink") boxes.push({x:W/2-Math.min(W-200,500)/2,y:H,z:D-500,w:Math.min(W-200,500),h:6,d:440,c:"steel",top:1});
    if (k==="mixer") boxes.push({x:W/2-20,y:H,z:D-560,w:40,h:260,d:40,c:"chrome",top:1},{x:W/2-15,y:H+230,z:D-560,w:30,h:30,d:170,c:"chrome",top:1});
    if (k==="hob") { const hw2=Math.min(W-60,580); boxes.push({x:W/2-hw2/2,y:H,z:D-540,w:hw2,h:8,d:500,c:"black",top:1});
      for (const [bx,bz] of [[0.28,0.3],[0.72,0.3],[0.28,0.72],[0.72,0.72]]) boxes.push({x:W/2-hw2/2+hw2*bx-45,y:H+8,z:D-540+500*bz-45,w:90,h:10,d:90,c:"metal",top:1}); }
    if (k==="trash") boxes.push({x:W-T-260,y:T+5,z:D-320,w:220,h:350,d:280,c:"plastic"});
    if (k==="cargo") boxes.push({x:T+20,y:T+40,z:60,w:Math.min(inner-40,200),h:H-160,d:D-120,c:"metal",wire:1});
    if (k==="dryer") boxes.push({x:T+15,y:Math.round(H*0.18),z:20,w:inner-30,h:12,d:D-60,c:"metal",wire:1},{x:T+15,y:Math.round(H*0.55),z:20,w:inner-30,h:12,d:D-60,c:"metal",wire:1});
    if (k==="led") boxes.push({x:20,y:-6,z:D-60,w:W-40,h:6,d:12,c:"led"});
    if (k==="rail") boxes.push(isWall ? {x:30,y:-260,z:-HDF-20,w:W-60,h:14,d:14,c:"chrome",wall:1} : {x:30,y:H+180,z:-HDF-60,w:W-60,h:14,d:14,c:"chrome",top:1});
    if (k==="hood") boxes.push({x:W/2-Math.min(W,600)/2,y:-140,z:D-330,w:Math.min(W,600),h:140,d:330,c:"steel"});
    if (k==="micro") boxes.push({x:T+10,y:Math.round(H*0.45),z:D-380,w:Math.min(inner-20,480),h:280,d:360,c:"appl"});
    if (k==="oven" && m.type==="tall") boxes.push({x:T+2,y:Math.round(H*0.30),z:D-560,w:inner-4,h:595,d:560,c:"appl"},{x:T+2,y:Math.round(H*0.30),z:D,w:inner-4,h:595,d:4,c:"ovendoor",a:{k:"flap",key:"toven"}});
    if (k==="dishwasher") boxes.push({x:20,y:80,z:20,w:W-40,h:H-90,d:D-40,c:"steel"});
    if (k==="stove") { boxes.push({x:0,y:0,z:0,w:W,h:H,d:D,c:"steel"},{x:0,y:H,z:0,w:W,h:6,d:D,c:"black"},
        {x:30,y:120,z:D,w:W-60,h:H-330,d:4,c:"ovendoor",a:{k:"flap",key:"so"}});
      for (const [bx,bz] of [[0.28,0.3],[0.72,0.3],[0.28,0.72],[0.72,0.72]]) boxes.push({x:W*bx-45,y:H+6,z:D*bz-45,w:90,h:12,d:90,c:"metal"}); }
    if (k==="fridge") boxes.push({x:0,y:0,z:0,w:W,h:H,d:D-30,c:"white"},
        {x:2,y:Math.round(H*0.38)+2,z:D-30,w:W-4,h:H-Math.round(H*0.38)-4,d:30,c:"white",handle:1,a:{k:"hinge",key:"fr1",side:"R"}},
        {x:2,y:2,z:D-30,w:W-4,h:Math.round(H*0.38)-4,d:30,c:"white",handle:1,a:{k:"hinge",key:"fr2",side:"R"}});
  }
  return {parts, hw, boxes, ex};
}

/* Butun loyiha: modullar joylashuvi, detallar, furnitura, qo'shimchalar, stoleshnitsa, tsokol */
function buildProject(P){
  const S = Object.assign({}, DEFAULT_SETTINGS, P.settings||{});
  let xFloor = 0, xWall = 0;
  const out = {S, parts:[], hw:{}, ex:{}, placed:[], worktopM:0, plinthM:0, runs:[]};
  let run = null;
  for (const m of P.modules) {
    const r = buildModule(m, S), t = TYPES[m.type];
    const wallRow = t.row === "wall";
    const x = wallRow ? xWall : xFloor;
    const elev = wallRow ? (t.alignTop ? S.wallBottom + 720 - m.h : S.wallBottom) : (t.legs || t.top ? S.plinth : 0);
    out.placed.push({m, x, elev, boxes:r.boxes});
    if (wallRow) xWall += m.w; else xFloor += m.w;
    out.parts.push(...r.parts);
    for (const k in r.hw) out.hw[k] = (out.hw[k]||0) + r.hw[k];
    for (const k in r.ex) out.ex[k] = (out.ex[k]||0) + r.ex[k];
    if (t.top) {
      if (t.legs) out.plinthM += m.w/1000;
      if (S.worktop) { if (!run) { run = {x, w:0, d:m.d, h:S.plinth+m.h}; out.runs.push(run); } run.w += m.w; run.d=Math.max(run.d,m.d); run.h=Math.max(run.h,S.plinth+m.h); }
    } else if (!wallRow) run = null;
  }
  out.worktopM = out.runs.reduce((a,r)=>a+r.w,0)/1000;
  out.width = Math.max(xFloor, xWall);
  return out;
}

/* Kromka: [L1,L2,W1,W2] — 0 yo'q, 1 = 0.4 mm, 2 = 2 mm. Metr (+10% zaxira) */
function edgeMeters(parts){
  let e2=0, e04=0;
  for (const p of parts) { const lens=[p.L,p.L,p.W,p.W]; p.edge.forEach((c,i)=>{ const m=lens[i]*p.qty/1000; if(c===2)e2+=m; else if(c===1)e04+=m; }); }
  return {e2:e2*1.1, e04:e04*1.1};
}
function edgeText(e){ const s=c=>c===2?"2":c===1?".4":"–"; return `${s(e[0])} ${s(e[1])} | ${s(e[2])} ${s(e[3])}`; }

/* Raskroy: MaxRects (eng qisqa tomon bo'yicha joylashtirish) */
function packSheets(parts, S, allowRotate){
  const kerf=+S.kerf||0, trim=+S.trim||0;
  const SW = S.sheetL - 2*trim + kerf, SH = S.sheetW - 2*trim + kerf;
  const items = [];
  parts.forEach((p,pi)=>{ for(let i=0;i<p.qty;i++) items.push({pi, L:p.L, W:p.W, w:p.L+kerf, h:p.W+kerf}); });
  items.sort((a,b)=> (b.w*b.h - a.w*a.h) || (Math.max(b.w,b.h)-Math.max(a.w,a.h)));
  const sheets=[], tooBig=[];
  const fits=(fr,w,h)=> w<=fr.w && h<=fr.h;
  function place(sh, it){
    let best=null;
    for (const fr of sh.free) {
      for (const rot of allowRotate ? [false,true] : [false]) {
        const w = rot?it.h:it.w, h = rot?it.w:it.h;
        if (!fits(fr,w,h)) continue;
        const ss = Math.min(fr.w-w, fr.h-h), ls = Math.max(fr.w-w, fr.h-h);
        if (!best || ss<best.ss || (ss===best.ss && ls<best.ls)) best={x:fr.x,y:fr.y,w,h,rot,ss,ls};
      }
    }
    if (!best) return false;
    const r={x:best.x,y:best.y,w:best.w,h:best.h};
    const nf=[];
    for (const fr of sh.free) {
      if (r.x>=fr.x+fr.w || r.x+r.w<=fr.x || r.y>=fr.y+fr.h || r.y+r.h<=fr.y) { nf.push(fr); continue; }
      if (r.x>fr.x) nf.push({x:fr.x,y:fr.y,w:r.x-fr.x,h:fr.h});
      if (r.x+r.w<fr.x+fr.w) nf.push({x:r.x+r.w,y:fr.y,w:fr.x+fr.w-r.x-r.w,h:fr.h});
      if (r.y>fr.y) nf.push({x:fr.x,y:fr.y,w:fr.w,h:r.y-fr.y});
      if (r.y+r.h<fr.y+fr.h) nf.push({x:fr.x,y:r.y+r.h,w:fr.w,h:fr.y+fr.h-r.y-r.h});
    }
    sh.free = nf.filter((a,i)=>!nf.some((b,j)=>j!==i && a.x>=b.x && a.y>=b.y && a.x+a.w<=b.x+b.w && a.y+a.h<=b.y+b.h && (j<i || a.w!==b.w || a.h!==b.h || a.x!==b.x || a.y!==b.y)));
    sh.items.push({pi:it.pi, x:best.x+trim, y:best.y+trim, w:best.rot?it.W:it.L, h:best.rot?it.L:it.W, rot:best.rot});
    sh.used += it.L*it.W;
    return true;
  }
  for (const it of items) {
    const okSize = (it.w<=SW && it.h<=SH) || (allowRotate && it.h<=SW && it.w<=SH);
    if (!okSize) { tooBig.push(it); continue; }
    let done=false;
    for (const sh of sheets) if (place(sh,it)) { done=true; break; }
    if (!done) { const sh={free:[{x:0,y:0,w:SW,h:SH}], items:[], used:0}; sheets.push(sh); place(sh,it); }
  }
  const area = S.sheetL*S.sheetW;
  sheets.forEach(s=>{ s.pct = Math.round(100*s.used/area); delete s.free; });
  return {sheets, tooBig, area};
}

/* Hammasi: guruhlar, raskroy, smeta */
function compute(P, prices){
  const pr = Object.assign({}, PRICE_DEFAULTS, prices||{});
  const R = buildProject(P), S = R.S;
  const body = R.parts.filter(p=>p.mat==="body"), facade = R.parts.filter(p=>p.mat==="facade"), hdf = R.parts.filter(p=>p.mat==="hdf");
  const glassParts = R.parts.filter(p=>p.mat==="glass"), glassM2 = glassParts.reduce((a,p)=>a+p.L*p.W*p.qty,0)/1e6;
  const rot = !S.grain;
  const cut = {body:packSheets(body,S,rot), hdf:packSheets(hdf,S,true)};
  if (S.facade==="ldsp") cut.facade = packSheets(facade,S,rot);
  const facadeM2 = facade.reduce((a,p)=>a+p.L*p.W*p.qty,0)/1e6;
  const edges = edgeMeters(R.parts);
  const L = []; const line=(grp,name,qty,unit,price)=>{ if(qty>0) L.push({grp,name,qty,unit,price,sum:Math.round(qty*price)}); };
  line("Material","LDSP 16 mm — korpus", cut.body.sheets.length, "list", pr.ldsp);
  if (cut.facade) line("Material","LDSP 16 mm — fasad", cut.facade.sheets.length, "list", pr.ldsp_f);
  else line("Material", S.facade==="akril"?"Akril/AGT fasad":"MDF fasad", +facadeM2.toFixed(2), "m²", S.facade==="akril"?pr.akril:pr.mdf);
  line("Material","Oynali fasad (ramka + oyna)", +glassM2.toFixed(2), "m²", pr.glass_door);
  line("Material","DVP / HDF 3 mm", cut.hdf.sheets.length, "list", pr.hdf);
  line("Material","Kromka 2 mm", Math.ceil(edges.e2), "m", pr.edge2);
  line("Material","Kromka 0.4 mm", Math.ceil(edges.e04), "m", pr.edge04);
  if (R.worktopM) line("Material","Stoleshnitsa", +R.worktopM.toFixed(2), "m", pr.worktop);
  if (R.plinthM) line("Material","Tsokol", +R.plinthM.toFixed(2), "m", pr.plinth);
  const HWN = {hinge_gtv:"Petlya GTV",hinge_blum:"Petlya Blum",slide_gtv:"Napravlyayushchiy GTV (juft)",slide_blum:"Blum Tandembox",
    lift_gtv:"Lift GTV",lift_blum:"Blum Aventos",kupe:"Kupe tizimi",handle:"Ruchka",leg:"Nojka",hanger:"Osma",support:"Polka ushlagich",
    confirmat:"Konfirmat",rod:"Shtanga",flap:"Pastga ochiladigan mexanizm"};
  for (const k of Object.keys(HWN)) if (R.hw[k]) line("Furnitura", HWN[k], k==="rod"?+R.hw[k].toFixed(2):R.hw[k], k==="rod"?"m":"dona", pr[k]);
  for (const k of Object.keys(EXTRAS)) if (R.ex[k]) { const e = EXTRAS[k], q = e.m ? +R.ex[k].toFixed(2) : R.ex[k];
    if (pr[e.p] > 0) line(["hob","oven","micro","dishwasher","stove","fridge","hood"].includes(k) ? "Texnika" : "Qo'shimchalar", e.uz, q, e.m ? "m" : "dona", pr[e.p]); }
  const sheetsAll = cut.body.sheets.length + cut.hdf.sheets.length + (cut.facade?cut.facade.sheets.length:0);
  line("Xizmat","Raskroy (kesish)", sheetsAll, "list", pr.cut);
  line("Xizmat","Kromkalash", Math.ceil(edges.e2+edges.e04), "m", pr.edging);
  const mat = L.reduce((a,l)=>a+l.sum,0);
  const labor = Math.round(mat*(+S.labor||0)/100);
  const cost = mat + labor + Math.round(+S.delivery||0);
  const client = Math.round(cost*(1+(+S.markup||0)/100)/10000)*10000;
  return {R, S, cut, facade, facadeM2, glassParts, glassM2, edges, lines:L, mat, labor, cost, client, profit:client-cost, HWN, pr};
}
if (typeof module !== "undefined") module.exports = {TYPES, EXTRAS, extrasFor, newModule, buildModule, buildProject, packSheets, compute, edgeMeters, hingesFor, DEFAULT_SETTINGS, PRICE_DEFAULTS};
/* ======================== END ENGINE ======================== */
</script>

  const r=await fetch(url,opt);let j={};try{j=await r.json();}catch(e){}if(!r.ok){const e=new Error(j.error||"Xatolik yuz berdi");e.status=r.status;throw e;}return j;}

const PALETTE=["#e8d9bd","#d6e4d2","#dcd6ea","#f0d5cf","#d2e2ea","#efe2c4","#e2d6cf","#d9e8de"];
function sheetSvg(sh,parts,S0,no){

    ${showName?`<text x="${it.x+it.w/2}" y="${it.y+it.h/2+fs*0.95}" font-size="${fs*0.62}" text-anchor="middle" fill="#4a4540">${esc(p.name.slice(0,24))}</text>`:""}</g>`;}).join("");
  return `<div class="sheet"><b>List ${no}</b> <span class="note">· ${sh.items.length} detal · ishlatilgan ${sh.pct}% · chiqindi ${100-sh.pct}%</span>

function cutBlock(key,title,res,parts){
  if(!res||!parts.length)return"";

  return `<div class="card"><h2>${title} <small>${res.sheets.length} list · o'rtacha to'lish ${avg}%</small></h2>
   ${res.tooBig.length?`<div class="warn">⚠️ ${res.tooBig.length} ta detal listga sig'maydi (list ${S.C.S.sheetL}×${S.C.S.sheetW}). O'lchamni tekshiring.</div>`:""}
   <div class="sheets">${res.sheets.map((sh,i)=>sheetSvg(sh,parts,S.C.S,i+1)).join("")}</div></div>`;
}

let G=null;
const ANIM={hinge:1.65,lift:1.35,flap:1.45};
function draw3d(){
  const el=$("#view");if(!el)return;
  if(!window.THREE){el.innerHTML=`<div class="msg">3D yuklanmadi (internet sekin bo'lishi mumkin). Hisob-kitoblar ishlayveradi.</div>`;return;}
  const P=S.P,R=S.C.R,st=S.C.S;
  if(!R.placed.length){el.innerHTML=`<div class="msg">Modul qo'shing — 3D shu yerda ko'rinadi</div>`;if(G){G.dispose();G=null;}return;}
  if(!G||!el.contains(G.renderer.domElement)||(!G.ctl&&THREE.OrbitControls)){
    const keep=G?G.state:{};if(G)G.dispose();
    const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
    el.innerHTML="";el.appendChild(renderer.domElement);
    const scene=new THREE.Scene();scene.background=new THREE.Color("#ebe5da");
    const cam=new THREE.PerspectiveCamera(40,1,0.05,50);
    scene.add(new THREE.HemisphereLight(0xffffff,0xb9b0a3,0.85));const dl=new THREE.DirectionalLight(0xffffff,0.55);dl.position.set(2,4,5);scene.add(dl);
    const ctl=THREE.OrbitControls?new THREE.OrbitControls(cam,renderer.domElement):null;if(ctl){ctl.enableDamping=true;ctl.maxPolarAngle=Math.PI*0.52;}
    const group=new THREE.Group();scene.add(group);
    let raf=0;const loop=()=>{raf=requestAnimationFrame(loop);
      for(const g of G.anims){const u=g.userData.anim;const tg=G.state[u.key]?1:0;if(Math.abs(tg-u.cur)>0.001){u.cur+=(tg-u.cur)*0.16;applyAnim(g);}}
      ctl&&ctl.update();renderer.render(scene,cam);};
    const ro=new ResizeObserver(()=>{const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix();});ro.observe(el);
    const cv=renderer.domElement;
    const pick=(cx,cy)=>{if(!THREE.Raycaster)return;const r=cv.getBoundingClientRect();const v=new THREE.Vector2(((cx-r.left)/r.width)*2-1,-((cy-r.top)/r.height)*2+1);
      const rc=new THREE.Raycaster();rc.setFromCamera(v,cam);const hits=rc.intersectObjects(group.children,true);
      for(const h of hits){let o=h.object;while(o&&o!==group){if(o.userData&&o.userData.anim){const k=o.userData.anim.key;G.state[k]=!G.state[k];return;}o=o.parent;}}};
    cv.addEventListener("dblclick",e=>pick(e.clientX,e.clientY));
    let lastTap=0,lx=0,ly=0;cv.addEventListener("pointerup",e=>{if(e.pointerType==="mouse")return;const now=Date.now();
      if(now-lastTap<350&&Math.abs(e.clientX-lx)<30&&Math.abs(e.clientY-ly)<30){pick(e.clientX,e.clientY);lastTap=0;}else{lastTap=now;lx=e.clientX;ly=e.clientY;}});
    G={renderer,scene,cam,ctl,group,fitKey:"",state:keep,anims:[],dispose(){cancelAnimationFrame(raf);ro.disconnect();renderer.dispose();}};
    loop();
  }
  const grp=G.group;
  const clear=o=>{while(o.children.length){const c=o.children.pop();clear(c);c.geometry&&c.geometry.dispose();}};clear(grp);G.anims=[];
  const L=(c,o)=>new THREE.MeshLambertMaterial(Object.assign({color:c},o||{}));
  const mats={body:L(st.bodyColor),facade:L(st.facadeColor),back:L("#cfc6b8"),drawer:L("#d8d0c2"),metal:L("#9a9a9a"),top:L(st.topColor),
    plinth:L("#4a4643"),handle:L("#8c8c8c"),floor:L("#d8cfc0"),wall:L("#f4efe6"),steel:L("#b9bdc1"),chrome:L("#d7dadd"),black:L("#1d1d1f"),
    appl:L("#2c2c2e"),ovendoor:L("#151517",{transparent:true,opacity:0.85}),white:L("#f3f3f1"),plastic:L("#7a7a7a"),led:L("#fff3b8",{emissive:0x6b5a20}),
    glass:L("#a9c8cf",{transparent:true,opacity:0.32})};
  const k=0.001;
  const mesh=(parent,x,y,z,w,h,d,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(Math.max(w,1)*k,Math.max(h,1)*k,Math.max(d,1)*k),mat);m.position.set((x+w/2)*k,(y+h/2)*k,(z+d/2)*k);parent.add(m);return m;};
  const W=R.width||1000;
  mesh(grp,-300,-10,-400,W+600,10,1600,mats.floor);mesh(grp,-300,0,-420,W+600,2700,20,mats.wall);
  const groups={};
  for(const pl of R.placed){
    const topLift=st.worktop&&TYPES[pl.m.type].top?38:0;
    for(const b of pl.boxes){
      const x0=pl.x+b.x,y0=pl.elev+b.y+(b.top?topLift:0),z0=b.z;
      let par=grp,ox=0,oy=0,oz=0;
      if(b.a){const key=pl.m.id+":"+b.a.key;let g=groups[key];
        if(!g){g=new THREE.Group();const a=b.a;let px=0,py=0,pz=0;
          if(a.k==="hinge"){px=a.side==="L"?x0:x0+b.w;pz=z0+b.d;}else if(a.k==="lift"){py=y0+b.h;pz=z0+b.d;}else if(a.k==="flap"){py=y0;pz=z0+b.d;}
          g.position.set(px*k,py*k,pz*k);g.userData.anim={key,k:a.k,side:a.side,dist:a.dist||0,cur:G.state[key]?1:0,base:{x:px*k,y:py*k,z:pz*k}};
          groups[key]=g;grp.add(g);G.anims.push(g);applyAnim(g);}
        par=g;ox=g.userData.anim.base.x/k;oy=g.userData.anim.base.y/k;oz=g.userData.anim.base.z/k;}
      const X=x0-ox,Y=y0-oy,Z=z0-oz;
      if(b.c==="glassdoor"){const f=Math.min(55,b.w/5,b.h/5);mesh(par,X,Y,Z,b.w,f,b.d,mats.facade);mesh(par,X,Y+b.h-f,Z,b.w,f,b.d,mats.facade);
        mesh(par,X,Y+f,Z,f,b.h-2*f,b.d,mats.facade);mesh(par,X+b.w-f,Y+f,Z,f,b.h-2*f,b.d,mats.facade);mesh(par,X+f,Y+f,Z+b.d/2-2,b.w-2*f,b.h-2*f,4,mats.glass);}
      else mesh(par,X,Y,Z,b.w,b.h,b.d,mats[b.c]||mats.body);
      if(b.handle){const hz=Z+b.d;
        if(b.handle===2)mesh(par,X+b.w/2-60,Y+b.h-40,hz,120,12,14,mats.handle);
        else if(b.handle===3)mesh(par,X+b.w/2-60,Y+20,hz,120,12,14,mats.handle);
        else if(b.h>b.w){const side=b.a&&b.a.k==="hinge"?b.a.side:"L";mesh(par,X+(side==="L"?b.w-40:28),Y+(pl.elev>1000?20:b.h-180),hz,12,120,14,mats.handle);}
        else mesh(par,X+b.w/2-60,Y+b.h-40,hz,120,12,14,mats.handle);}
    }
    if(pl.elev>0&&pl.elev<300&&TYPES[pl.m.type].legs)mesh(grp,pl.x,0,pl.m.d-70,pl.m.w,pl.elev,16,mats.plinth);
  }
  for(const r of R.runs)mesh(grp,r.x,r.h,-5,r.w,38,r.d+40,mats.top);
  const key=P.modules.length+":"+W;
  if(G.fitKey!==key){G.fitKey=key;const cx=W*k/2,dist=Math.max(2.4,W*k*1.15);G.cam.position.set(cx+dist*0.35,1.5,dist);if(G.ctl){G.ctl.target.set(cx,1.0,0.25);G.ctl.update();}else G.cam.lookAt(cx,1,0.25);}
}
function applyAnim(g){const u=g.userData.anim,c=u.cur;
  if(u.k==="hinge")g.rotation.y=(u.side==="L"?-1:1)*c*ANIM.hinge;
  else if(u.k==="lift")g.rotation.x=-c*ANIM.lift;
  else if(u.k==="flap")g.rotation.x=c*ANIM.flap;
  else if(u.k==="slide")g.position.z=u.base.z+c*u.dist*0.001;
  else if(u.k==="kupe")g.position.x=u.base.x+c*u.dist*0.001;}
function openAll(v){if(!G)return;for(const g of G.anims)G.state[g.userData.anim.key]=!!v;}

/* -------- saqlash / ochish -------- */
async function saveProject(){
  const b=$("#saveBtn");b.disabled=true;
  try{const r=await api("/api/admin/bazis/projects",{method:"POST",body:JSON.stringify({id:S.id||0,name:S.P.name,client:S.P.client,data:S.P,total:S.C.client})});
    S.id=r.id;S.dirty=false;toast("✓ Loyiha saqlandi");try{localStorage.setItem("bazis_draft",JSON.stringify({id:S.id,P:S.P}));}catch(e){}}
  catch(e){toast("⚠️ "+e.message);}finally{b.disabled=false;}
}
async function openList(){
  let list=[];try{list=(await api("/api/admin/bazis/projects")).projects;}catch(e){return toast("⚠️ "+e.message);}
  const d=document.createElement("div");d.className="modal";d.onclick=e=>{if(e.target===d)d.remove();};
  d.innerHTML=`<div><h2 style="font-family:var(--serif);margin:0 0 10px">Loyihalar</h2>${list.length?list.map(p=>`<div class="prow"><span><b>${esc(p.name)}</b><br><small class="note">${esc(p.client||"")} · ${new Date(p.updated*1000).toLocaleDateString("ru-RU")} · ${money(p.total)}</small></span>
    <button class="btn s" onclick="loadProject(${p.id})">Ochish</button><button class="btn x s" onclick="delProject(${p.id},this)">🗑</button></div>`).join(""):`<div class="note">Hali saqlangan loyiha yo'q.</div>`}
    <div style="margin-top:12px"><button class="btn l" onclick="this.closest('.modal').remove()">Yopish</button></div></div>`;
  document.body.appendChild(d);
}
async function loadProject(id){try{const r=await api("/api/admin/bazis/projects/"+id);S.P=normalize(r.project.data);S.id=r.project.id;S.sel=null;S.dirty=false;recalc();document.querySelector(".modal")?.remove();S.tab="project";render();}catch(e){toast("⚠️ "+e.message);}}
async function delProject(id,btn){if(!confirm("Loyihani o'chirasizmi?"))return;try{await api(`/api/admin/bazis/projects/${id}/delete`,{method:"POST"});btn.closest(".prow").remove();if(S.id===id)S.id=0;}catch(e){toast("⚠️ "+e.message);}}
function newProject(){if(S.dirty&&!confirm("Saqlanmagan o'zgarishlar bor. Yangi loyiha boshlaysizmi?"))return;S.P=blank();S.id=0;S.sel=null;S.dirty=false;recalc();S.tab="project";render();}
function normalize(P){P=P||blank();P.settings=Object.assign({},DEFAULT_SETTINGS,P.settings||{});P.modules=(P.modules||[]).filter(m=>TYPES[m.type]);P.modules.forEach(m=>{if(!Array.isArray(m.extras))m.extras=[];});return P;}

/* -------- chop etish / Excel -------- */
function doPrint(){
  const C=S.C,P=S.P;const body=C.R.parts.filter(p=>p.mat==="body"),hdf=C.R.parts.filter(p=>p.mat==="hdf");
  const old=S.tab;let html=`<h1>iSofa — ${esc(P.name)}</h1><div>${esc(P.client||"")} · ${new Date().toLocaleDateString("ru-RU")} · Furnitura: ${C.S.furn==="blum"?"Blum":"GTV"}</div>`;
  html+=`<h2>Smeta</h2>`+viewCost().replace(/<input[^>]*value="([^"]*)"[^>]*>/g,"$1");
  html+=`<h2>Detallar</h2>`+viewParts();
  html+=`<h2>Raskroy</h2>`+cutBlock("body","Korpus — LDSP 16 mm",C.cut.body,body)+(C.cut.facade?cutBlock("facade","Fasad — LDSP",C.cut.facade,C.facade):"")+cutBlock("hdf","DVP / HDF 3 mm",C.cut.hdf,hdf);
  try{if(G){html=`<img src="${G.renderer.domElement.toDataURL("image/jpeg",0.85)}" style="width:100%;max-height:320px;object-fit:contain;margin:8px 0">`+html;}}catch(e){}
  $("#print").innerHTML=html;S.tab=old;setTimeout(()=>window.print(),200);
}
function exportXlsx(){
  if(!window.XLSX)return toast("⚠️ Excel kutubxonasi yuklanmadi");
  const C=S.C,wb=XLSX.utils.book_new();
  const parts=[["№","Material","Modul","Detal","L, mm","W, mm","Soni","Kromka L1","Kromka L2","Kromka W1","Kromka W2"]];
  const e=c=>c===2?"2 mm":c===1?"0.4 mm":"";let i=0;
  for(const k of ["body","facade","hdf"])C.R.parts.filter(p=>p.mat===k).forEach(p=>parts.push([++i,k==="body"?"LDSP 16":k==="hdf"?"DVP 3":"Fasad",p.modName,p.name,p.L,p.W,p.qty,...p.edge.map(e)]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(parts),"Detallar");
  const sm=[["Guruh","Nomi","Miqdor","Birlik","Narx","Summa"],...C.lines.map(l=>[l.grp,l.name,l.qty,l.unit,l.price,l.sum]),[],
    ["","Materiallar, furnitura, xizmatlar","","","",C.mat],["","Ish haqi ("+C.S.labor+"%)","","","",C.labor],["","Yetkazib berish","","","",+C.S.delivery||0],
    ["","Tannarx","","","",C.cost],["","Ustama ("+C.S.markup+"%)","","","",C.profit],["","Mijozga narx","","","",C.client]];
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(sm),"Smeta");
  const cut=[["Material","List №","To'lish %","Detallar soni"]];
  for(const [k,n] of [["body","LDSP korpus"],["facade","LDSP fasad"],["hdf","DVP"]])if(C.cut[k])C.cut[k].sheets.forEach((s,j)=>cut.push([n,j+1,s.pct,s.items.length]));
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(cut),"Raskroy");
  XLSX.writeFile(wb,`iSofa-${(S.P.name||"loyiha").replace(/[^\wА-Яа-яЁё' -]/g,"").slice(0,40)}.xlsx`);
}

async function start(){
  try{S.prices=(await api("/api/admin/bazis/prices")).prices||{};}
  catch(e){if(e.status===401||e.status===403){$("#app").innerHTML=`<div class="gate"><h2 style="font-family:var(--serif);margin-top:0">Kirish kerak</h2>Bu sahifa faqat do'kon admini uchun.<br><br>Telegram'da botga <b>/menyu</b> → «🧩 Bazis» tugmasini bosing.<br>Kompyuterda: botga <b>/panel</b> deb yozing, havolani oching va «🧩 Bazis»ni tanlang.</div>`;$("#tabs").innerHTML="";return;}}
  let d=null;try{d=JSON.parse(localStorage.getItem("bazis_draft")||"null");}catch(e){}
  S.P=normalize(d&&d.P);S.id=(d&&d.id)||0;recalc();render();
}
