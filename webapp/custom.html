<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>O'lchamga buyurtma</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root {
  --bg: var(--tg-theme-bg-color, #ffffff);
  --bg2: var(--tg-theme-secondary-bg-color, #f3f1ee);
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, #ffffff));
  --text: var(--tg-theme-text-color, #1d1b19);
  --hint: var(--tg-theme-hint-color, #8d8780);
  --link: var(--tg-theme-link-color, #b4692f);
  --accent: var(--tg-theme-button-color, #b4692f);
  --accent-text: var(--tg-theme-button-text-color, #ffffff);
  --danger: var(--tg-theme-destructive-text-color, #e0453a);
  --line: color-mix(in srgb, var(--hint) 22%, transparent);
  --soft: color-mix(in srgb, var(--accent) 12%, var(--card));
  --r: 16px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg2); color: var(--text); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
body.web { max-width: 640px; margin: 0 auto; min-height: 100vh; box-shadow: 0 0 0 1px var(--line); }
html:has(body.web) { background: #ebe4da; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea, select { font: inherit; color: var(--text); }
.hidden { display: none !important; }
.muted { color: var(--hint); }
.small { font-size: 13px; }
a { color: var(--link); }

/* sarlavha: ikki eshik */
header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 14px 10px; border-bottom: 1px solid var(--line); }
.doors { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--bg2); border-radius: 12px; padding: 4px; }
.doors a, .doors button { text-align: center; padding: 9px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--hint); text-decoration: none; }
.doors .on { background: var(--card); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.hrow { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 8px; }
.hrow h1 { font-size: 18px; margin: 0; }
.langsw { display: flex; gap: 2px; background: var(--bg2); border-radius: 9px; padding: 3px; }
.langsw button { padding: 4px 9px; border-radius: 7px; font-size: 12px; font-weight: 700; color: var(--hint); }
.langsw button.on { background: var(--card); color: var(--text); }
.mine-btn { color: var(--link); font-weight: 600; font-size: 14px; }

/* qadamlar */
.progress { display: flex; gap: 5px; padding: 14px 16px 4px; }
.progress i { flex: 1; height: 4px; border-radius: 3px; background: var(--line); transition: background .3s; }
.progress i.on { background: var(--accent); }
.step-t { padding: 6px 16px 2px; font-size: 13px; color: var(--hint); font-weight: 600; letter-spacing: .02em; }
h2.q { margin: 2px 16px 14px; font-size: 22px; line-height: 1.25; }
.section { background: var(--card); border-radius: var(--r); margin: 0 12px 12px; padding: 14px; }
.kinds { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 12px; }
.kind { background: var(--card); border-radius: var(--r); padding: 16px 14px; text-align: left; border: 2px solid transparent; transition: border-color .15s, transform .15s; }
.kind:active { transform: scale(.98); }
.kind.on { border-color: var(--accent); background: var(--soft); }
.kind .ic { font-size: 30px; display: block; margin-bottom: 8px; }
.kind b { display: block; font-size: 15px; }
.kind small { color: var(--hint); font-size: 12px; }
.model { display: flex; gap: 12px; align-items: center; }
.model img, .model .ph { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; background: var(--bg2); flex: none; display: grid; place-items: center; font-size: 28px; }
.model b { display: block; }
.diagram { display: flex; justify-content: center; padding: 6px 0 4px; color: var(--accent); }
.diagram svg { width: 100%; max-width: 300px; height: auto; }
.diagram text { font: 700 13px -apple-system, sans-serif; fill: var(--accent); }
label.f { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 6px; }
label.f:first-child { margin-top: 0; }
.in { width: 100%; border: 1px solid var(--line); background: var(--bg2); border-radius: 12px; padding: 12px 14px; outline: none; font-size: 16px; }
.in:focus { border-color: var(--accent); }
.unit { position: relative; }
.unit .in { padding-right: 46px; }
.unit::after { content: "sm"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--hint); font-size: 14px; pointer-events: none; }
html[lang=ru] .unit::after { content: "см"; }
textarea.in { min-height: 84px; resize: vertical; }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: var(--bg2); margin-top: 12px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); flex: none; margin: 1px 0 0; }
.tiers { display: flex; flex-direction: column; gap: 8px; }
.tier { text-align: left; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; background: var(--card); display: flex; justify-content: space-between; gap: 10px; align-items: center; }
.tier.on { border-color: var(--accent); background: var(--soft); }
.tier b { display: block; }
.tier small { color: var(--hint); }
.tier .k { font-size: 13px; color: var(--hint); white-space: nowrap; }
.colors { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
.color { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--card); box-shadow: 0 0 0 1px var(--line); }
.color.on { box-shadow: 0 0 0 2.5px var(--accent); }
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; border-radius: 12px; overflow: hidden; background: var(--bg2); }
.photo img { width: 100%; height: 100%; object-fit: cover; }
.photo button { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; font-size: 14px; }
.addph { aspect-ratio: 1; border-radius: 12px; border: 2px dashed var(--line); display: grid; place-items: center; text-align: center; color: var(--hint); font-size: 13px; }
.addph span { font-size: 26px; display: block; }
.est { background: var(--soft); border-radius: var(--r); margin: 0 12px 12px; padding: 16px; }
.est b { font-size: 19px; display: block; margin: 2px 0; }
.sum-row { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.sum-row:last-child { border: 0; }
.sum-row span:first-child { color: var(--hint); }
.sum-row span:last-child { text-align: right; font-weight: 500; white-space: pre-line; }
.err { color: var(--danger); font-size: 14px; margin: 0 16px 12px; }

/* pastki tugma */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); display: flex; gap: 8px; }
body.web .bar { left: max(0px, calc(50% - 320px)); right: max(0px, calc(50% - 320px)); }
.btn { background: var(--accent); color: var(--accent-text); border-radius: 12px; padding: 14px 18px; font-weight: 600; font-size: 16px; text-align: center; }
.btn.soft { background: var(--soft); color: var(--link); }
.btn.grow { flex: 1; }
.btn[disabled] { opacity: .55; pointer-events: none; }
.btn.small { padding: 8px 12px; font-size: 14px; border-radius: 10px; }

/* arizalar ro'yxati */
.req { background: var(--card); border-radius: var(--r); margin: 0 12px 12px; padding: 14px; }
.req-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.tag { display: inline-block; padding: 4px 10px; border-radius: 20px; background: var(--soft); color: var(--link); font-size: 13px; font-weight: 600; white-space: nowrap; }
.tag.red { background: color-mix(in srgb, var(--danger) 14%, var(--card)); color: var(--danger); }
.stages { display: flex; gap: 4px; margin: 12px 0 8px; }
.stages i { flex: 1; height: 5px; border-radius: 3px; background: var(--line); }
.stages i.on { background: var(--accent); }
.empty { text-align: center; padding: 50px 20px; color: var(--hint); }
.empty .big { font-size: 52px; }
.done { text-align: center; padding: 40px 22px 10px; }
.done .big { font-size: 64px; }
.done h2 { margin: 10px 0; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 12px 10px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--card); padding: 7px 13px; border-radius: 20px; font-size: 14px; white-space: nowrap; }
.chip.on { background: var(--accent); color: var(--accent-text); }
.ph-grid { display: flex; gap: 8px; overflow-x: auto; margin-top: 10px; }
.ph-grid img { width: 96px; height: 96px; object-fit: cover; border-radius: 10px; flex: none; background: var(--bg2); }
.admin-acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%); background: rgba(20,20,20,.9); color: #fff; padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 50; max-width: 90%; text-align: center; }
.skeleton { height: 120px; border-radius: var(--r); margin: 12px; background: linear-gradient(90deg, var(--card) 25%, var(--bg2) 50%, var(--card) 75%); background-size: 200% 100%; animation: sk 1.2s infinite; }
@keyframes sk { to { background-position: -200% 0; } }

/* ---------- uslublar ---------- */
.intro { padding: 16px 16px 6px; }
.intro h2 { margin: 0 0 6px; font-size: 22px; line-height: 1.25; }
.intro p { margin: 0; color: var(--hint); font-size: 14px; }
.styles { display: flex; flex-direction: column; gap: 14px; padding: 12px; }
.style-card { display: block; width: 100%; text-align: left; background: var(--card); border-radius: 20px; overflow: hidden;
  box-shadow: 0 1px 2px rgba(0,0,0,.05); transition: transform .15s; }
.style-card:active { transform: scale(.985); }
.cover { position: relative; aspect-ratio: 16 / 9; background: var(--bg2); overflow: hidden; }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .art { width: 100%; height: 100%; display: grid; place-items: center; }
.cover .art svg { width: 62%; height: auto; }
.cover .nm { position: absolute; left: 14px; bottom: 12px; color: #fff; font-size: 24px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
.cover .cnt { position: absolute; right: 12px; top: 12px; background: rgba(0,0,0,.55); color: #fff; font-size: 12px; padding: 4px 9px; border-radius: 20px; }
.style-body { padding: 12px 14px 14px; }
.style-body p { margin: 0 0 10px; color: var(--hint); font-size: 13.5px; }
.prices { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.pr { background: var(--bg2); border-radius: 12px; padding: 8px 9px; }
.pr small { display: block; color: var(--hint); font-size: 11.5px; line-height: 1.25; }
.pr b { display: block; font-size: 13.5px; margin-top: 2px; }
.more { display: flex; justify-content: space-between; align-items: center; margin-top: 12px; color: var(--link); font-weight: 600; }
.hero-img { position: relative; aspect-ratio: 4 / 3; background: var(--bg2); }
.hero-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero-img .art { width: 100%; height: 100%; display: grid; place-items: center; }
.hero-img .art svg { width: 60%; }
.ptable .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px dashed var(--line); }
.ptable .row:last-child { border: 0; }
.ptable .row b { white-space: nowrap; font-size: 16px; }
.ptable .row small { display: block; color: var(--hint); font-size: 12px; }
.gal { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 12px 12px; }
.gal button { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--bg2); }
.gal img { width: 100%; height: 100%; object-fit: cover; display: block; }
.gal .cap { position: absolute; left: 0; right: 0; bottom: 0; padding: 18px 8px 6px; font-size: 12px; color: #fff; text-align: left;
  background: linear-gradient(transparent, rgba(0,0,0,.6)); }
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.92); display: flex; flex-direction: column; }
.lb-top { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; color: #fff; }
.lb-top button { color: #fff; font-size: 26px; width: 40px; height: 40px; }
.lb-img { flex: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
.lb-img img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lb-bot { padding: 12px 14px calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
.lb-bot .btn.soft { background: rgba(255,255,255,.14); color: #fff; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.seg button { padding: 12px 10px; border-radius: 12px; border: 2px solid var(--line); text-align: left; background: var(--card); }
.seg button b { display: block; font-size: 14.5px; }
.seg button small { color: var(--hint); font-size: 12px; }
.seg button.on { border-color: var(--accent); background: var(--soft); }
.chiprow { display: flex; flex-wrap: wrap; gap: 8px; }
.kchip { padding: 9px 13px; border-radius: 20px; background: var(--bg2); font-size: 14.5px; border: 2px solid transparent; }
.kchip.on { border-color: var(--accent); background: var(--soft); font-weight: 600; }
.pick { display: flex; gap: 12px; align-items: center; }
.pick img { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; flex: none; background: var(--bg2); }
.pick .x { margin-left: auto; color: var(--hint); font-size: 20px; padding: 6px; }
.unit-hint { font-size: 12.5px; color: var(--hint); margin-top: 6px; }
.adm-tabs { display: flex; gap: 6px; padding: 12px 12px 0; }
.adm-tabs button { flex: 1; padding: 9px 6px; border-radius: 10px; background: var(--card); font-weight: 600; font-size: 13.5px; }
.adm-tabs button.on { background: var(--accent); color: var(--accent-text); }
.ag { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
.ag div { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg2); }
.ag img { width: 100%; height: 100%; object-fit: cover; }
.ag .del { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,0,0,.6); color: #fff; }
.ag .k { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.6); color: #fff; font-size: 11px; padding: 2px 6px; border-radius: 8px; }
select.in { appearance: none; -webkit-appearance: none; }
/* qanday ishlaydi */
.how { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 12px 12px 0; }
.how div { background: var(--card); border-radius: 14px; padding: 10px 8px; text-align: center; font-size: 12.5px; line-height: 1.3; }
.how span { display: block; font-size: 22px; margin-bottom: 4px; }
.visit-note { display: flex; gap: 10px; align-items: center; background: var(--soft); border-radius: var(--r); margin: 0 12px 12px; padding: 12px 14px; font-size: 14px; }
.visit-note span { font-size: 24px; }
.sdoors { display: flex; flex-direction: column; gap: 12px; padding: 4px 12px 12px; }
.sdoor { position: relative; display: block; width: 100%; aspect-ratio: 16 / 8; border-radius: 20px; overflow: hidden; text-align: left; background: var(--bg2); box-shadow: 0 1px 3px rgba(0,0,0,.08); transition: transform .15s; }
.sdoor:active { transform: scale(.985); }
.sdoor img, .sdoor .art { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.sdoor .art { display: grid; place-items: center; padding-bottom: 40px; }
.sdoor .art svg { width: 40%; }
.sdoor .ov { position: absolute; left: 0; right: 0; bottom: 0; padding: 40px 16px 14px; background: linear-gradient(transparent, rgba(0,0,0,.55)); color: #fff; display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; }
.sdoor .ov b { display: block; font-size: 24px; line-height: 1.1; }
.sdoor .ov small { font-size: 13.5px; opacity: .92; }
.sdoor .go { flex: none; background: rgba(255,255,255,.95); color: #1d1b19; font-weight: 600; font-size: 13.5px; padding: 8px 12px; border-radius: 20px; }
.feats { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
.feats div { display: flex; gap: 10px; align-items: flex-start; font-size: 14.5px; }
.feats span { font-size: 18px; width: 24px; text-align: center; flex: none; }
.calc-res { margin-top: 12px; background: var(--soft); border-radius: 12px; padding: 12px 14px; }
.calc-res b { display: block; font-size: 19px; margin: 2px 0; }
.fee { background: var(--soft); border-radius: var(--r); margin: 0 12px 12px; padding: 14px; }
.fee b { display: block; font-size: 16px; margin-bottom: 4px; }
.fee .check { background: var(--card); }
.lead { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--bg2); white-space: nowrap; }
.lead.hot { background: #fde3d6; color: #b5410f; }
.lead.cold { background: #e3eef8; color: #2b6aa3; }
details.more-f summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; color: var(--link); font-weight: 600; }
details.more-f summary::-webkit-details-marker { display: none; }
details.more-f summary::after { content: "＋"; }
details.more-f[open] summary::after { content: "－"; }
</style>
</head>
<body>
<header>
  <div class="doors"><a id="toReady" href="/app">🛋 <span data-t="ready">Tayyor mebellar</span></a><button class="on" onclick="go('styles')">📐 <span data-t="custom">O'lchamga</span></button></div>
  <div class="hrow"><h1 id="title" data-t="title">O'lchamga buyurtma</h1>
    <div style="display:flex;gap:10px;align-items:center"><button class="mine-btn" onclick="go('mine')" data-t="mine">Arizalarim</button>
      <div class="langsw" id="langsw"><button data-l="uz">UZ</button><button data-l="ru">RU</button></div></div></div>
</header>
<main id="view"><div class="skeleton"></div><div class="skeleton"></div></main>
<div class="bar hidden" id="bar"></div>
<div id="lb"></div>
<input type="file" id="fileIn" accept="image/*" multiple class="hidden">
<input type="file" id="galIn" accept="image/*" multiple class="hidden">

<script>
"use strict";
const tg = window.Telegram && window.Telegram.WebApp;
const IN_TG = !!(tg && tg.initData);
if (tg) { tg.ready(); tg.expand(); }
document.body.classList.add(IN_TG ? "tg" : "web");
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } },
                set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
const haptic = () => { try { tg.HapticFeedback.impactOccurred("light"); } catch (e) {} };
const notifyH = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const qs = new URLSearchParams(location.search);
const normLang = l => String(l || "").toLowerCase().startsWith("ru") ? "ru" : "uz";
let LANG = normLang(qs.get("lang") || store.get("lang", "") || (tg && tg.initDataUnsafe && tg.initDataUnsafe.user && tg.initDataUnsafe.user.language_code));

const I18N = {
  uz: { ready: "Tayyor mebellar", custom: "O'lchamga", title: "O'lchamga buyurtma", mine: "Arizalarim",
    intro_t: "Qaysi uslub sizga yoqadi?", intro_p: "Uslubni tanlang — namuna ishlar va taxminiy narxlarni ko'rasiz.",
    open_s: "Ko'rish ›", feats_t: "Uslub xususiyatlari",
    how1: "Uslubni tanlaysiz", how2: "Usta uyingizga kelib o'lchaydi", how3: "Narx va shartnoma joyida",
    visit_note: "O'lchamni bilishingiz shart emas — usta uyingizga kelib o'zi o'lchaydi.",
    visit_note_fee: "O'lchamni bilishingiz shart emas — usta kelib o'lchaydi. O'lchov va maslahat {f}, shartnoma tuzsangiz narxdan to'liq chegiriladi.",
    calc_t: "Taxminiy narxni hisoblang", calc_len: "Oshxona uzunligi", calc_w: "Eni", calc_h: "Balandligi", m: "metr",
    calc_res: "Taxminan", calc_note: "Aniq narx o'lchov, material va furnituradan keyin aytiladi.", calc_none: "Bu uslub uchun narxni menejer aytadi.",
    f_need: "Mebel qachon kerak?", f_repair: "Ta'mir holati?", e_need: "Mebel qachon kerakligini tanlang", e_repair: "Ta'mir holatini tanlang",
    fee_t: "O'lchov va maslahat — {f}", fee_p: "Usta uyingizga kelib o'lchaydi, material, rang va dizayn bo'yicha maslahat beradi. Shartnoma tuzsangiz, bu summa mebel narxidan to'liq chegiriladi.",
    fee_ok: "Shartlarga roziman", e_fee: "O'lchov shartlariga rozilikni belgilang",
    price_only: "Menejer qo'ng'iroq qilib, narx bo'yicha maslahat beradi. Taxminiy narxni uslub sahifasidagi kalkulyatorda ham ko'rishingiz mumkin.",

function t(k, v) { let s = (I18N[LANG] || I18N.uz)[k] ?? I18N.uz[k] ?? k; if (v) for (const x in v) s = s.split("{" + x + "}").join(v[x]); return s; }
const money = n => Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, " ") + (LANG === "ru" ? " сум" : " so'm");
function toast(m) { const d = document.createElement("div"); d.className = "toast"; d.textContent = m; document.body.appendChild(d); setTimeout(() => d.remove(), 2400); }
function alertBox(m) { if (IN_TG && tg.showAlert) tg.showAlert(m); else alert(m); }
function confirmBox(m) { return new Promise(r => { if (IN_TG && tg.showConfirm) tg.showConfirm(m, r); else r(confirm(m)); }); }

async function api(path, { method = "GET", json, form } = {}) {
  const opt = { method, headers: { "X-Init-Data": (tg && tg.initData) || "", "X-Lang": LANG } };
  if (!IN_TG && store.get("wtok", "")) opt.headers["X-Web-Token"] = store.get("wtok", "");
  if (json) { opt.method = "POST"; opt.headers["Content-Type"] = "application/json"; opt.body = JSON.stringify(json); }
  if (form) { opt.method = "POST"; opt.body = form; }
  if (opt.method === "POST" && !opt.body) opt.body = "{}";
  let res;
  try { res = await fetch(path, opt); } catch (e) { throw new Error(t("net_err")); }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || t("gen_err"));
  return data;
}

function validate() {
  if (!F.kind) return t("e_kind");
  if (F.kind === "other" && F.note.trim().length < 5 && !F.sample) return t("e_note");
  if (!F.need) return t("e_need");
  if (F.need !== "price" && !F.repair) return t("e_repair");
  if (F.need !== "price" && S.cfg.measure_fee && !F.fee) return t("e_fee");
  if (F.name.trim().length < 2) return t("e_name");
  const dg = F.phone.replace(/\D/g, ""); if (dg.length < 9 || dg.length > 15) return t("e_phone");
  return "";
}

/* rasmlar (yuborishdan oldin kichraytiramiz) */
function shrink(file, max = 1600) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { URL.revokeObjectURL(url); b ? res(b) : rej(); }, "image/jpeg", 0.85);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(); };
    img.src = url;
  });
}
$("#fileIn").onchange = async e => {
  const files = Array.from(e.target.files || []).slice(0, S.cfg.max_photos - F.photos.length);
  for (const f of files) { try { const b = await shrink(f); F.photos.push({ blob: b, url: URL.createObjectURL(b) }); } catch (x) { toast("⚠️ " + f.name); } }
  e.target.value = ""; refresh();
};
function delPhoto(i) { URL.revokeObjectURL(F.photos[i].url); F.photos.splice(i, 1); refresh(); }

async function submit() {
  err = validate();
  if (err) { notifyH("error"); refresh(); scrollTo({ top: 0, behavior: "smooth" }); return; }
  if (sending) return; sending = true; refresh();
  try {
    if (!IN_TG && !store.get("wtok", "")) store.set("wtok", (await api("/api/web/session", { method: "POST" })).token);
    const fd = new FormData();
    fd.append("data", JSON.stringify({ style: F.style, kind: F.kind, need_when: F.need, repair: F.need === "price" ? "" : F.repair, fee_ok: F.need !== "price" && F.fee,
      measure_visit: F.need !== "price", visit_day: F.need === "price" ? "" : F.day, visit_time: F.day === "call" ? "" : F.time,
      color: F.color, note: F.note, sample_id: F.sample || 0, name: F.name, phone: F.phone, city: F.city, model_id: S.cfg.model ? S.cfg.model.id : 0 }));
    F.photos.forEach((p, i) => fd.append("photo", p.blob, `rasm${i + 1}.jpg`));
    const { request } = await api("/api/custom/request", { form: fd });
    notifyH("success");
    const keep = { name: F.name, phone: F.phone, city: F.city };
    Object.assign(F, { style: "", kind: "", need: "", repair: "", fee: false, day: "", time: "", color: "", note: "", sample: 0, photos: [] }, keep);
    saveDraft(); S.cfg.model = null;
    S.done = request; S.mine = null; S.view = "done"; scrollTo(0, 0);
  } catch (e) { err = e.message; notifyH("error"); scrollTo({ top: 0, behavior: "smooth" }); }
  finally { sending = false; refresh(); }
}

  catch (e) { alertBox(e.message); }
}
function replaceReq(r) { const i = S.adm.list.findIndex(x => x.id === r.id); if (i >= 0) S.adm.list[i] = r; refresh(); openReq(r.id); }

/* ---------------- chizish ---------------- */
function bar(html) { const b = $("#bar"); if (!html) { b.classList.add("hidden"); b.innerHTML = ""; } else { b.classList.remove("hidden"); b.innerHTML = html; } }
function refresh() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => el.textContent = t(el.dataset.t));
  document.querySelectorAll("#langsw button").forEach(b => b.classList.toggle("on", b.dataset.l === LANG));
  $("#toReady").href = "/app?lang=" + LANG;
  document.title = t("title");
  const v = $("#view");
  if (!S.cfg) return;
  if (S.view === "styles") { v.innerHTML = stylesHTML(); bar(""); }
  else if (S.view === "style") {
    if (!styleOf(S.style)) { S.view = "styles"; return refresh(); }
    v.innerHTML = styleHTML();
    bar(`<button class="btn soft" onclick="go('styles')">←</button>${phoneOf() ? `<a class="btn soft" href="${telHref(phoneOf())}" aria-label="${t("call")}">📞</a>` : ""}<button class="btn grow" onclick="toForm()">${t("order_style")}</button>`);
  } else if (S.view === "form") {
    v.innerHTML = formHTML();
    bar(`<button class="btn soft" onclick="go(F.style ? 'style' : 'styles')">←</button><button class="btn grow" ${sending ? "disabled" : ""} onclick="submit()">${sending ? t("sending") : F.need === "price" ? t("send_call") : t("send")}</button>`);
  } else if (S.view === "done") {
    const r = S.done;
    v.innerHTML = `<div class="done"><div class="big">📨</div><h2>${t("done_t")}</h2><p class="muted">№ ${r.id} · ${esc(r.kind_name)}${r.style_name ? " · " + esc(r.style_name) : ""}</p>
      <p class="muted small">${IN_TG ? t("done_tg") : t("done_web")}</p></div>` + contactHTML();
    bar(`<button class="btn soft grow" onclick="go('mine')">${t("to_mine")}</button><button class="btn grow" onclick="go('styles')">${t("new_req")}</button>`);
  } else if (S.view === "mine") {
    if (!S.mine) { v.innerHTML = `<div class="skeleton"></div>`; loadMine(); bar(""); return; }
    v.innerHTML = `<div class="intro"><h2>${t("mine")}</h2></div>` + (S.mine.length ? S.mine.map(r => reqCard(r)).join("")
      : `<div class="empty"><div class="big">📐</div>${t("no_req")}</div>`) + contactHTML()
      + (S.isAdmin ? `<div class="section"><button class="btn" style="width:100%" onclick="go('admin')">🗂 Barcha arizalar (admin)</button></div>` : "");
    bar(`<button class="btn grow" onclick="go('styles')">${t("start")}</button>`);
  } else if (S.view === "admin") {
    v.innerHTML = adminHTML();
    bar(S.adm.open && S.adm.tab === "list" ? `<button class="btn soft grow" onclick="S.adm.open=0; refresh()">← Ro'yxatga qaytish</button>` : "");
  }
  if (tg && tg.BackButton) S.view !== "styles" ? tg.BackButton.show() : tg.BackButton.hide();
}
function go(view) { S.view = view; err = ""; if (view === "admin" && !S.adm.list) loadAdmin(); if (view === "mine") S.mine = null; scrollTo(0, 0); refresh(); }
if (tg && tg.BackButton) tg.BackButton.onClick(() => {
  if (S.lb) { S.lb = null; return drawLb(); }
  if (S.view === "admin" && S.adm.open) { S.adm.open = 0; return refresh(); }
  if (S.view === "form") return go(F.style ? "style" : "styles");
  go("styles");
});
$("#langsw").onclick = async e => { const b = e.target.closest("[data-l]"); if (!b) return; LANG = b.dataset.l; store.set("lang", LANG); await loadCfg(); refresh(); };

async function loadCfg() {
  const model = qs.get("model") || "";
  const d = await api(`/api/custom/config?lang=${LANG}${model ? "&model=" + encodeURIComponent(model) : ""}`);
  const keepModel = S.cfg && S.cfg.model === null;  // ariza yuborilgach model tozalangan bo'lsa — qaytarmaymiz
  S.cfg = d; if (keepModel) S.cfg.model = null;
  if (d.model && !F.kind && !keepModel) {  // modelning bo'limidan mebel turini taxmin qilamiz
    const nm = (d.model_cat + " " + d.model.name).toLowerCase();
    F.kind = /burchak|углов/.test(nm) ? "corner" : /divan|диван/.test(nm) ? "sofa" : /shkaf|шкаф/.test(nm) ? "wardrobe" : /oshxona|кухн/.test(nm) ? "kitchen" : "";
  }
  if (F.sample && !sampleOf(F.sample)) F.sample = 0;
}
(async function init() {
  refresh();
  try { await loadCfg(); }
  catch (e) { $("#view").innerHTML = `<div class="empty"><div class="big">⚠️</div>${esc(e.message)}<br><br><button class="btn" onclick="location.reload()">↻</button></div>`; return; }
  if (IN_TG && !F.name) { const u = tg.initDataUnsafe && tg.initDataUnsafe.user; if (u) F.name = [u.first_name, u.last_name].filter(Boolean).join(" "); }
  const g = qs.get("go");
  if (g === "mine") S.view = "mine";
  else if (g === "admin" || qs.get("admin")) { S.view = "admin"; loadAdmin(); }
  else if (qs.get("style") && styleOf(qs.get("style"))) { S.style = qs.get("style"); S.view = "style"; }
  refresh();
})();
</script>
</body>
</html>
